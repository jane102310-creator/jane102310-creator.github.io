<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitleText">Jane代購清單</title>
  <style>
    :root {
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #5A4D41;
      --text-sub: #8C705F;
      --accent: #8C705F;
      --accent-light: #F4EBE1;
      --border-color: #EFECE6;
      --shadow: 0 4px 16px rgba(90, 77, 65, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 120px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 16px; text-align: center; }
    .header-title h1 { font-size: 22px; font-weight: 700; color: var(--text-main); }

    /* 分類篩選列 */
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); transition: all 0.2s; }
    .filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    .item-card { background: var(--card-bg); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }
    .item-card.completed { opacity: 0.65; background: #F9F8F6; }
    .item-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: #F4EBE1; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
    .tag-category { background-color: var(--accent-light); color: var(--text-sub); }
    .tag-buyer { background-color: #E8E2D8; color: #5A4D41; cursor: pointer; }
    .tag-status-done { background-color: #D4EDDA; color: #155724; font-weight: bold; }
    .item-name { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-note { font-size: 12px; color: #999; margin-top: 2px; }
    .btn-buy-action { background-color: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

    .footer-admin-section { margin-top: 40px; text-align: center; padding: 20px; }
    .btn-footer-admin { background: none; border: 1px dashed var(--accent); color: var(--text-sub); padding: 10px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; opacity: 0.7; }
    .btn-footer-admin:hover { opacity: 1; background: var(--accent-light); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); display: block; }
    .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; background: #FAFAFA; outline: none; }
    
    /* 多單位選購控制項 */
    .unit-qty-row { display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    .unit-qty-controls { display: flex; align-items: center; gap: 12px; }
    .btn-qty-sm { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text-main); }
    .btn-qty-sm.plus { background: var(--accent); color: white; border: none; }
    .qty-display-sm { font-size: 16px; font-weight: bold; min-width: 24px; text-align: center; }

    .btn-submit { width: 100%; background-color: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-save-manual { width: 100%; background-color: #28A745; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; margin-bottom: 8px; }
    .btn-danger { background-color: #D9534F !important; margin-top: 8px; }

    .admin-nav { display: flex; gap: 4px; margin-bottom: 16px; }
    .admin-tab-btn { flex: 1; padding: 8px 2px; border: none; background: #EFECE6; color: var(--text-sub); font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 11px; text-align: center; }
    .admin-tab-btn.active { background: var(--accent); color: white; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-item-row { background: #FAFAFA; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; position: relative; }
    .admin-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
    .admin-item-info { flex: 1; min-width: 0; }
    .admin-item-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .admin-buyer-detail { font-size: 12px; color: var(--text-sub); margin-left: 12px; }
    .admin-summary-total { font-size: 13px; font-weight: bold; color: var(--accent); margin: 4px 0 6px 0; background: var(--accent-light); padding: 4px 8px; border-radius: 6px; display: inline-block; }
    
    /* 採購進度區塊樣式 */
    .progress-box { background: #FFF; border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; margin: 6px 0; font-size: 12px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .progress-controls { display: flex; align-items: center; gap: 6px; }
    .btn-mini-qty { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; font-weight: bold; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .btn-status-toggle { width: 100%; margin-top: 6px; padding: 6px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .status-ongoing { background: #FFF3CD; color: #856404; }
    .status-done { background: #D4EDDA; color: #155724; }

    /* 顧客管理卡片樣式 */
    .customer-card { background: #FAFAFA; border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; margin-bottom: 12px; }
    .customer-name { font-size: 15px; font-weight: bold; color: var(--accent); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; display: flex; justify-content: space-between; }
    .customer-item-row { font-size: 13px; color: var(--text-main); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 6px; }
    .customer-item-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .customer-item-top { display: flex; justify-content: space-between; align-items: center; }
    .customer-progress-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; }

    .admin-action-btns { display: flex; gap: 6px; margin-top: 8px; }
    .btn-edit-prod { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-del-prod { background: #D9534F; color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title"><h1 id="headerTitleDisplay">Jane代購清單</h1></div>
    </div>
    
    <!-- 分類篩選列 -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-pill active" onclick="setCategoryFilter('全部', this)">全部商品</button>
      <button class="filter-pill" onclick="setCategoryFilter('食品/食材', this)">食品/食材</button>
      <button class="filter-pill" onclick="setCategoryFilter('日用品', this)">日用品</button>
      <button class="filter-pill" onclick="setCategoryFilter('美妝保養', this)">美妝保養</button>
      <button class="filter-pill" onclick="setCategoryFilter('文具雜貨', this)">文具雜貨</button>
    </div>

    <div id="itemList"></div>

    <div class="footer-admin-section">
      <button class="btn-footer-admin" onclick="openAdminPortal()">管理者</button>
    </div>
  </div>

  <!-- 密碼登入 Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <div class="modal-header"><h2>🔐 管理者登入</h2><button class="btn-close" onclick="closeModal('loginModal')">✕</button></div>
      <div class="form-group">
        <label class="form-label">請輸入密碼</label>
        <input type="password" id="adminPwdInput" class="form-input" placeholder="預設密碼: 1234" />
      </div>
      <button class="btn-submit" onclick="submitLogin()">登入後台</button>
    </div>
  </div>

  <!-- 新增購買 Modal -->
  <div class="modal-overlay" id="qtyModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="editModalTitle">新增購買</h2><button class="btn-close" onclick="closeModal('qtyModal')">✕</button></div>
      <div class="form-group"><label class="form-label">購買人 / 登記人</label><input type="text" id="editBuyer" class="form-input" placeholder="例如：敏敏..." /></div>
      <div class="form-group">
        <label class="form-label">各單位購買數量</label>
        <div id="unitQtyContainer"></div>
      </div>
      <button class="btn-submit" onclick="saveNewBuy()">確認新增登記</button>
    </div>
  </div>

  <!-- 修改購買數量 Modal -->
  <div class="modal-overlay" id="editBuyerModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="editBuyerModalTitle">修改購買數量</h2><button class="btn-close" onclick="closeModal('editBuyerModal')">✕</button></div>
      <div class="form-group"><label class="form-label">購買人</label><input type="text" id="existingBuyerName" class="form-input" readonly style="background:#eee;" /></div>
      <div class="form-group">
        <label class="form-label">各單位購買數量（歸零即代表刪除該單位）</label>
        <div id="editUnitQtyContainer"></div>
      </div>
      <button class="btn-submit" onclick="saveExistBuy()">儲存修改</button>
      <button class="btn-submit btn-danger" onclick="delAllExistBuy()">刪除此人所有購買紀錄</button>
    </div>
  </div>

  <!-- 修改商品資料 Modal (含隱藏商品開關) -->
  <div class="modal-overlay" id="editProdModal" style="z-index: 1100;">
    <div class="modal-content">
      <div class="modal-header"><h2>✏️ 修改商品資料</h2><button class="btn-close" onclick="closeEditProdModal()">✕</button></div>
      <div class="form-group"><label class="form-label">商品名稱 *</label><input type="text" id="editProdName" class="form-input" /></div>
      <div class="form-group"><label class="form-label">分類</label>
        <select id="editProdCategory" class="form-select">
          <option value="食品/食材">食品/食材</option>
          <option value="日用品">日用品</option>
          <option value="美妝保養">美妝保養</option>
          <option value="文具雜貨">文具雜貨</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">數量單位（多個單位請用逗號隔開，例如：盒,片）</label><input type="text" id="editProdUnits" class="form-input" placeholder="盒,片" /></div>
      <div class="form-group"><label class="form-label">商品圖片網址 (URL)</label>
        <input type="text" id="editProdImage" class="form-input" placeholder="請貼上圖片網址..." />
      </div>
      <div class="form-group"><label class="form-label">備註說明</label><input type="text" id="editProdNote" class="form-input" /></div>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: #FAFAFA; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color);">
        <input type="checkbox" id="editProdHidden" style="width: 20px; height: 20px; cursor: pointer;" />
        <label for="editProdHidden" class="form-label" style="margin-bottom: 0; cursor: pointer;">隱藏此商品（主頁面暫不顯示）</label>
      </div>
      <button class="btn-submit" onclick="saveEditProd()">儲存商品修改</button>
    </div>
  </div>

  <!-- 管理者後台 Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <div class="modal-header"><h2>🔐 管理者後台</h2><button class="btn-close" onclick="closeModal('adminModal')">✕</button></div>
      
      <div class="admin-nav">
        <button class="admin-tab-btn active" id="tabBtn1" onclick="switchTab(1)">📦 商品及統計數量</button>
        <button class="admin-tab-btn" id="tabBtn2" onclick="switchTab(2)">👥 顧客管理</button>
        <button class="admin-tab-btn" id="tabBtn3" onclick="switchTab(3)">➕ 新增商品</button>
        <button class="admin-tab-btn" id="tabBtn4" onclick="switchTab(4)">⚙️ 設定</button>
      </div>

      <!-- 分頁 1：商品及統計數量 -->
      <div class="admin-section active" id="adminSec1">
        <div id="adminContentList" style="max-height: 50vh; overflow-y: auto; margin-bottom: 12px;"></div>
        <button class="btn-save-manual" onclick="manualSaveData()">💾 儲存所有變更</button>
      </div>

      <!-- 分頁 2：顧客管理 -->
      <div class="admin-section" id="adminSec2">
        <div id="customerContentList" style="max-height: 50vh; overflow-y: auto; margin-bottom: 12px;"></div>
        <button class="btn-save-manual" onclick="manualSaveData()">💾 儲存所有變更</button>
      </div>

      <!-- 分頁 3：新增商品 -->
      <div class="admin-section" id="adminSec3">
        <div class="form-group"><label class="form-label">商品名稱 *</label><input type="text" id="itemName" class="form-input" placeholder="例如：積雪草面膜..." /></div>
        <div class="form-group"><label class="form-label">分類</label>
          <select id="itemCategory" class="form-select">
            <option value="食品/食材">食品/食材</option>
            <option value="日用品">日用品</option>
            <option value="美妝保養">美妝保養</option>
            <option value="文具雜貨">文具雜貨</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">數量單位（多個單位請用逗號隔開，例如：盒,片）</label><input type="text" id="itemUnits" class="form-input" value="盒,片" placeholder="盒,片" /></div>
        <div class="form-group"><label class="form-label">商品圖片網址 (URL)</label>
          <input type="text" id="itemImage" class="form-input" placeholder="請貼上圖片網址..." />
        </div>
        <div class="form-group"><label class="form-label">備註說明</label><input type="text" id="itemNote" class="form-input" placeholder="規格或口味..." /></div>
        <button class="btn-submit" onclick="saveNewProd()">確認新增商品</button>
      </div>

      <!-- 分頁 4：管理者設定（修改標題與密碼） -->
      <div class="admin-section" id="adminSec4">
        <div class="form-group">
          <label class="form-label">修改網頁標題名稱</label>
          <input type="text" id="siteTitleInput" class="form-input" placeholder="Jane代購清單" />
        </div>
        <button class="btn-submit" onclick="saveSiteTitle()" style="margin-bottom: 20px;">更新網頁標題</button>
        
        <div style="border-top: 1px solid var(--border-color); padding-top: 16px;">
          <div class="form-group"><label class="form-label">目前密碼</label><input type="password" id="oldPwd" class="form-input" placeholder="請輸入目前密碼..." /></div>
          <div class="form-group"><label class="form-label">新密碼</label><input type="password" id="newPwd" class="form-input" placeholder="請輸入新密碼..." /></div>
          <div class="form-group"><label class="form-label">確認新密碼</label><input type="password" id="confirmPwd" class="form-input" placeholder="再次輸入新密碼..." /></div>
          <button class="btn-submit" onclick="saveNewPassword()">更新管理者密碼</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var currentEditIndex = null;
    var currentItemIndex = null;
    var editingBuyerName = '';
    var editingProdIndex = null;
    var isAuthed = false;
    var currentCategoryFilter = 'default_all';
    
    var ADMIN_PASSWORD = localStorage.getItem('buylist_admin_pwd') || '1234';
    var SITE_TITLE = localStorage.getItem('buylist_site_title') || 'Jane代購清單';

    // 初始化頁面標題
    document.getElementById('pageTitleText').innerText = SITE_TITLE;
    document.getElementById('headerTitleDisplay').innerText = SITE_TITLE;
    document.getElementById('siteTitleInput').value = SITE_TITLE;

    var defaultProducts = [
      { id: 1, name: '咖啡糖Americano', buyers: [{name: 'Jane', count: 1, unit: '包', bought: 0}], category: '食品/食材', units: ['包', '個'], note: '', image: '', purchasedCounts: {}, isCompleted: false, isHidden: false },
      { id: 2, name: '積雪草面膜', buyers: [{name: '敏敏', count: 1, unit: '盒', bought: 0}, {name: '敏敏', count: 5, unit: '片', bought: 0}], category: '美妝保養', units: ['盒', '片'], note: '', image: '', purchasedCounts: {}, isCompleted: false, isHidden: false }
    ];

    var products = defaultProducts;

    try {
      var saved = localStorage.getItem('buylist_v35_products');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) { products = parsed; }
      }
    } catch(e) {
      products = defaultProducts;
    }

    function manualSaveData() {
      try {
        localStorage.setItem('buylist_v35_products', JSON.stringify(products));
        alert('💾 儲存成功！所有變更已安全儲存。');
      } catch (e) {
        try {
          localStorage.removeItem('buylist_v33_products');
          localStorage.removeItem('buylist_v34_products');
          localStorage.setItem('buylist_v35_products', JSON.stringify(products));
          alert('💾 儲存成功！系統已自動清理暫存空間並完成儲存。');
        } catch (err) {
          alert('儲存空間已滿！');
        }
      }
    }

    function saveSiteTitle() {
      var newTitle = document.getElementById('siteTitleInput').value.trim();
      if (!newTitle) { alert('網頁標題不能為空！'); return; }
      SITE_TITLE = newTitle;
      localStorage.setItem('buylist_site_title', newTitle);
      document.getElementById('pageTitleText').innerText = newTitle;
      document.getElementById('headerTitleDisplay').innerText = newTitle;
      alert('網頁標題更新成功！');
    }

    function setCategoryFilter(category, btnElement) {
      currentCategoryFilter = category;
      var pills = document.querySelectorAll('.filter-pill');
      pills.forEach(function(p) { p.classList.remove('active'); });
      if (btnElement) btnElement.classList.add('active');
      renderList();
    }

    function fixImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('freeimage.host/i/')) {
        var id = url.split('/i/').pop();
        return 'https://iili.io/' + id + '.jpg';
      }
      return url;
    }

    function renderList() {
      var itemList = document.getElementById('itemList');
      if (!itemList) return;
      itemList.innerHTML = '';

      for (var i = 0; i < products.length; i++) {
        var product = products[i];
        if (product.isHidden) continue; // 如果設定為隱藏則不顯示在主頁面

        if (!product.buyers) product.buyers = [];
        if (!product.units || !Array.isArray(product.units)) product.units = ['個'];
        if (!product.purchasedCounts) product.purchasedCounts = {};

        for (var j = 0; j < product.buyers.length; j++) {
          if (product.buyers[j].bought === undefined) {
            product.buyers[j].bought = 0;
          }
        }

        if (currentCategoryFilter !== '全部' && currentCategoryFilter !== 'default_all' && product.category !== currentCategoryFilter) {
          continue;
        }

        var card = document.createElement('div');
        card.className = 'item-card' + (product.isCompleted ? ' completed' : '');

        var buyerMap = {};
        for (var j = 0; j < product.buyers.length; j++) {
          var b = product.buyers[j];
          var name = b.name.trim();
          if (!buyerMap[name]) buyerMap[name] = [];
          buyerMap[name].push({ count: b.count, unit: b.unit || '個' });
        }

        var buyerTagsHTML = '';
        var buyerNames = Object.keys(buyerMap);
        for (var k = 0; k < buyerNames.length; k++) {
          var name = buyerNames[k];
          var details = buyerMap[name];
          var detailStr = '';
          for (var d = 0; d < details.length; d++) {
            detailStr += '+' + details[d].count + details[d].unit + ' ';
          }
          buyerTagsHTML += '<span class="tag tag-buyer" onclick="openEditBuyerModal(' + i + ', \'' + name + '\')">' + name + ' ' + detailStr.trim() + '</span>';
        }

        if (product.isCompleted) {
          buyerTagsHTML += '<span class="tag tag-status-done">✅ 已完成</span>';
        }

        var defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        var imgSrc = product.image ? fixImageUrl(product.image) : defaultSvg;

        card.innerHTML = '<img src="' + imgSrc + '" class="item-img" alt="商品圖片" />' +
          '<div class="item-info">' +
            '<div class="item-tags"><span class="tag tag-category">' + product.category + '</span>' + buyerTagsHTML + '</div>' +
            '<div class="item-name">' + product.name + '</div>' +
            (product.note ? '<div class="item-note">' + product.note + '</div>' : '') +
          '</div>' +
          '<button class="btn-buy-action" onclick="openQtyModal(' + i + ')">+ 購買</button>';
        
        itemList.appendChild(card);
      }
      try {
        localStorage.setItem('buylist_v35_products', JSON.stringify(products));
      } catch(e) {}
    }

    function openAdminPortal() {
      if (isAuthed) {
        updateAdminStats();
        updateCustomerStats();
        document.getElementById('adminModal').classList.add('active');
      } else {
        document.getElementById('adminPwdInput').value = '';
        document.getElementById('loginModal').classList.add('active');
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function submitLogin() {
      var pwd = document.getElementById('adminPwdInput').value;
      if (pwd === ADMIN_PASSWORD) {
        isAuthed = true;
        closeModal('loginModal');
        updateAdminStats();
        updateCustomerStats();
        document.getElementById('adminModal').classList.add('active');
      } else {
        alert('密碼錯誤！');
      }
    }

    function saveNewPassword() {
      var oldP = document.getElementById('oldPwd').value;
      var newP = document.getElementById('newPwd').value;
      var confirmP = document.getElementById('confirmPwd').value;

      if (oldP !== ADMIN_PASSWORD) {
        alert('目前密碼輸入錯誤！');
        return;
      }
      if (!newP) {
        alert('新密碼不能為空！');
        return;
      }
      if (newP !== confirmP) {
        alert('兩次輸入的新密碼不一致！');
        return;
      }

      ADMIN_PASSWORD = newP;
      localStorage.setItem('buylist_admin_pwd', newP);
      alert('密碼修改成功！');
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
      switchTab(1);
    }

    function openQtyModal(index) {
      currentEditIndex = index;
      var product = products[index];
      document.getElementById('editModalTitle').innerText = '新增購買：' + product.name;
      document.getElementById('editBuyer').value = '';
      
      var container = document.getElementById('unitQtyContainer');
      container.innerHTML = '';
      var units = product.units && product.units.length > 0 ? product.units : ['個'];

      for (var u = 0; u < units.length; u++) {
        var unitName = units[u];
        var row = document.createElement('div');
        row.className = 'unit-qty-row';
        row.innerHTML = '<span>' + unitName + '</span>' +
          '<div class="unit-qty-controls">' +
            '<button class="btn-qty-sm" onclick="adjustModalQty(\'qty_' + u + '\', -1)">-</button>' +
            '<span class="qty-display-sm" id="qty_' + u + '">0</span>' +
            '<button class="btn-qty-sm plus" onclick="adjustModalQty(\'qty_' + u + '\', 1)">+</button>' +
          '</div>';
        container.appendChild(row);
      }

      document.getElementById('qtyModal').classList.add('active');
    }

    function adjustModalQty(elementId, delta) {
      var el = document.getElementById(elementId);
      var val = parseInt(el.innerText) + delta;
      if (val < 0) val = 0;
      el.innerText = val;
    }

    function saveNewBuy() {
      if (currentEditIndex !== null) {
        var buyerName = document.getElementById('editBuyer').value.trim();
        if (!buyerName) { alert('請輸入購買人姓名！'); return; }

        var product = products[currentEditIndex];
        var units = product.units && product.units.length > 0 ? product.units : ['個'];
        var addedCount = 0;

        for (var u = 0; u < units.length; u++) {
          var qty = parseInt(document.getElementById('qty_' + u).innerText);
          if (qty > 0) {
            product.buyers.push({ name: buyerName, count: qty, unit: units[u], bought: 0 });
            addedCount++;
          }
        }

        if (addedCount === 0) {
          alert('請至少選擇一項單量的數量！');
          return;
        }

        renderList();
        manualSaveData();
        closeModal('qtyModal');
      }
    }

    function openEditBuyerModal(itemIdx, buyerName) {
      currentItemIndex = itemIdx;
      editingBuyerName = buyerName;
      var product = products[itemIdx];

      document.getElementById('editBuyerModalTitle').innerText = '修改購買數量：' + product.name;
      document.getElementById('existingBuyerName').value = buyerName;

      var container = document.getElementById('editUnitQtyContainer');
      container.innerHTML = '';
      var units = product.units && product.units.length > 0 ? product.units : ['個'];

      var existingMap = {};
      for (var j = 0; j < product.buyers.length; j++) {
        var b = product.buyers[j];
        if (b.name.trim() === buyerName) {
          existingMap[b.unit || '個'] = b.count;
        }
      }

      for (var u = 0; u < units.length; u++) {
        var unitName = units[u];
        var currentQty = existingMap[unitName] !== undefined ? existingMap[unitName] : 0;

        var row = document.createElement('div');
        row.className = 'unit-qty-row';
        row.innerHTML = '<span>' + unitName + '</span>' +
          '<div class="unit-qty-controls">' +
            '<button class="btn-qty-sm" onclick="adjustModalQty(\'edit_qty_' + u + '\', -1)">-</button>' +
            '<span class="qty-display-sm" id="edit_qty_' + u + '">' + currentQty + '</span>' +
            '<button class="btn-qty-sm plus" onclick="adjustModalQty(\'edit_qty_' + u + '\', 1)">+</button>' +
          '</div>';
        container.appendChild(row);
      }

      document.getElementById('editBuyerModal').classList.add('active');
    }

    function saveExistBuy() {
      if (currentItemIndex !== null && editingBuyerName) {
        var product = products[currentItemIndex];
        var units = product.units && product.units.length > 0 ? product.units : ['個'];

        var newBuyers = [];
        for (var j = 0; j < product.buyers.length; j++) {
          if (product.buyers[j].name.trim() !== editingBuyerName) {
            newBuyers.push(product.buyers[j]);
          }
        }

        for (var u = 0; u < units.length; u++) {
          var qty = parseInt(document.getElementById('edit_qty_' + u).innerText);
          if (qty > 0) {
            newBuyers.push({ name: editingBuyerName, count: qty, unit: units[u], bought: 0 });
          }
        }

        product.buyers = newBuyers;
        renderList();
        manualSaveData();
        closeModal('editBuyerModal');
      }
    }

    function delAllExistBuy() {
      if (currentItemIndex !== null && editingBuyerName) {
        if (confirm('確定要刪除 ' + editingBuyerName + ' 在這個商品的所有購買紀錄嗎？')) {
          var product = products[currentItemIndex];
          var newBuyers = [];
          for (var j = 0; j < product.buyers.length; j++) {
            if (product.buyers[j].name.trim() !== editingBuyerName) {
              newBuyers.push(product.buyers[j]);
            }
          }
          product.buyers = newBuyers;
          renderList();
          manualSaveData();
          closeModal('editBuyerModal');
        }
      }
    }

    function deleteItemFromAdmin(i) {
      if (confirm('確定要從清單中徹底刪除這個商品嗎？')) {
        products.splice(i, 1);
        renderList();
        updateAdminStats();
        updateCustomerStats();
        manualSaveData();
      }
    }

    function updatePurchasedQty(itemIdx, unit, delta) {
      var p = products[itemIdx];
      if (!p.purchasedCounts) p.purchasedCounts = {};
      var current = p.purchasedCounts[unit] || 0;
      var next = current + delta;
      if (next < 0) next = 0;
      
      p.purchasedCounts[unit] = next;
      renderList();
      updateAdminStats();
    }

    function updateCustomerItemBought(itemIdx, buyerIdx, delta) {
      var b = products[itemIdx].buyers[buyerIdx];
      if (b.bought === undefined) b.bought = 0;
      b.bought += delta;
      if (b.bought < 0) b.bought = 0;
      if (b.bought > b.count) b.bought = b.count;
      
      renderList();
      updateCustomerStats();
    }

    function toggleCompleteStatus(itemIdx) {
      var p = products[itemIdx];
      p.isCompleted = !p.isCompleted;
      renderList();
      updateAdminStats();
      manualSaveData();
    }

    function updateCustomerStats() {
      var customerList = document.getElementById('customerContentList');
      if (!customerList) return;
      customerList.innerHTML = '';

      var customerMap = {};

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (!p.buyers) continue;
        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j];
          var cName = b.name.trim();
          if (!customerMap[cName]) {
            customerMap[cName] = [];
          }
          if (b.bought === undefined) b.bought = 0;
          
          customerMap[cName].push({
            itemIdx: i,
            buyerIdx: j,
            itemName: p.name,
            count: b.count,
            unit: b.unit || '個',
            bought: b.bought
          });
        }
      }

      var customerNames = Object.keys(customerMap);
      if (customerNames.length === 0) {
        customerList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">目前尚無任何顧客登記資料</div>';
        return;
      }

      var header = document.createElement('div');
      header.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color); color:var(--text-main);";
      header.innerText = '👥 總計顧客數：' + customerNames.length + ' 位';
      customerList.appendChild(header);

      for (var k = 0; k < customerNames.length; k++) {
        var name = customerNames[k];
        var items = customerMap[name];
        
        var card = document.createElement('div');
        card.className = 'customer-card';

        var itemsHtml = '';
        for (var m = 0; m < items.length; m++) {
          var it = items[m];
          var isDone = it.bought >= it.count;
          var badgeClass = isDone ? 'cust-badge-done' : 'cust-badge-ongoing';
          var badgeText = isDone ? '✅ 已完成' : '⏳ 進行中';

          itemsHtml += '<div class="customer-item-row">' +
            '<div class="customer-item-top">' +
              '<span>• ' + it.itemName + ' <b style="margin-left:4px;">' + it.count + ' ' + it.unit + '</b></span>' +
              '<span class="' + badgeClass + '">' + badgeText + '</span>' +
            '</div>' +
            '<div class="customer-progress-bar">' +
              '<span>🛒 個人已買：<b>' + it.bought + ' / ' + it.count + ' ' + it.unit + '</b></span>' +
              '<div class="progress-controls">' +
                '<button class="btn-mini-qty" onclick="updateCustomerItemBought(' + it.itemIdx + ', ' + it.buyerIdx + ', -1)">-</button>' +
                '<button class="btn-mini-qty" onclick="updateCustomerItemBought(' + it.itemIdx + ', ' + it.buyerIdx + ', 1)">+</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        card.innerHTML = '<div class="customer-name"><span>👤 ' + name + '</span><span style="font-size:12px; color:var(--text-sub);">共登記 ' + items.length + ' 項商品</span></div>' + itemsHtml;
        customerList.appendChild(card);
      }
    }

    function updateAdminStats() {
      var contentList = document.getElementById('adminContentList');
      if (!contentList) return;
      contentList.innerHTML = '';
      var totalRegistrationCount = 0;

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (!p.buyers) p.buyers = [];
        if (!p.purchasedCounts) p.purchasedCounts = {};
        
        var unitTotals = {};
        var buyersHtml = '';

        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j];
          totalRegistrationCount++;
          var u = b.unit ? b.unit : '個';
          if (!unitTotals[u]) { unitTotals[u] = 0; }
          unitTotals[u] += b.count;

          buyersHtml += '<div class="admin-buyer-detail">👤 ' + b.name + ': <b>' + b.count + '</b> ' + u + '</div>';
        }

        var summaryArr = [];
        var progressHtml = '';

        for (var unitKey in unitTotals) {
          var totalNeeded = unitTotals[unitKey];
          var boughtCount = p.purchasedCounts[unitKey] || 0;
          summaryArr.push('共 ' + totalNeeded + ' ' + unitKey);

          progressHtml += '<div class="progress-box">' +
            '<div class="progress-row">' +
              '<span>🛒 採購進度 (' + unitKey + ')：<b>已買 ' + boughtCount + ' / 共 ' + totalNeeded + ' ' + unitKey + '</b></span>' +
              '<div class="progress-controls">' +
                '<button class="btn-mini-qty" onclick="updatePurchasedQty(' + i + ', \'' + unitKey + '\', -1)">-</button>' +
                '<button class="btn-mini-qty" onclick="updatePurchasedQty(' + i + ', \'' + unitKey + '\', 1)">+</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        var summaryText = summaryArr.length > 0 ? summaryArr.join('，') : '尚無人登記';

        if (p.buyers.length === 0) {
          buyersHtml = '<div class="admin-buyer-detail" style="color:#aaa;">尚無人登記購買</div>';
          progressHtml = '<div style="font-size:12px; color:#aaa; margin:4px 0;">尚無採購進度目標</div>';
        }

        var defaultThumb = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        var thumbSrc = p.image ? fixImageUrl(p.image) : defaultThumb;
        var unitsText = p.units ? p.units.join(',') : '個';
        var statusBtnClass = p.isCompleted ? 'btn-status-toggle status-done' : 'btn-status-toggle status-ongoing';
        var statusBtnText = p.isCompleted ? '✅ 已完成採購 (點擊改為進行中)' : '⏳ 採購進行中 (點擊標記為完成)';
        var hiddenBadge = p.isHidden ? ' <span style="color:#D9534F; font-size:11px;">(已隱藏)</span>' : '';

        var row = document.createElement('div');
        row.className = 'admin-item-row';
        row.innerHTML = '<img src="' + thumbSrc + '" class="admin-thumb" alt="" />' +
          '<div class="admin-item-info">' +
            '<div class="admin-item-title"><span>📦 ' + p.name + hiddenBadge + ' <small style="color:var(--text-sub);">(' + unitsText + ')</small></span></div>' +
            '<div class="admin-summary-total">📊 ' + summaryText + '</div>' +
            buyersHtml +
            progressHtml +
            '<button class="' + statusBtnClass + '" onclick="toggleCompleteStatus(' + i + ')">' + statusBtnText + '</button>' +
            '<div class="admin-action-btns">' +
              '<button class="btn-edit-prod" onclick="openEditProdModal(' + i + ')">✏️ 編輯</button>' +
              '<button class="btn-del-prod" onclick="deleteItemFromAdmin(' + i + ')">🗑️ 刪除</button>' +
            '</div>' +
          '</div>';
        contentList.appendChild(row);
      }

      var summaryHeader = document.createElement('div');
      summaryHeader.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color); color:var(--text-main);";
      summaryHeader.innerText = '📊 總登記筆數：' + totalRegistrationCount + ' 筆';
      contentList.insertBefore(summaryHeader, contentList.firstChild);
    }

    function openEditProdModal(index) {
      editingProdIndex = index;
      var p = products[index];
      document.getElementById('editProdName').value = p.name;
      document.getElementById('editProdCategory').value = p.category || '食品/食材';
      document.getElementById('editProdUnits').value = p.units ? p.units.join(',') : '盒,片';
      document.getElementById('editProdNote').value = p.note || '';
      document.getElementById('editProdImage').value = p.image || '';
      document.getElementById('editProdHidden').checked = !!p.isHidden;
      document.getElementById('editProdModal').classList.add('active');
    }

    function closeEditProdModal() {
      document.getElementById('editProdModal').classList.remove('active');
    }

    function saveEditProd() {
      if (editingProdIndex !== null) {
        var name = document.getElementById('editProdName').value.trim();
        var category = document.getElementById('editProdCategory').value;
        var unitsStr = document.getElementById('editProdUnits').value.trim();
        var note = document.getElementById('editProdNote').value.trim();
        var imgUrl = document.getElementById('editProdImage').value.trim();
        var isHidden = document.getElementById('editProdHidden').checked;

        if (!name) { alert('請填寫商品名稱！'); return; }

        var unitsArr = unitsStr ? unitsStr.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean) : ['個'];

        products[editingProdIndex].name = name;
        products[editingProdIndex].category = category;
        products[editingProdIndex].units = unitsArr;
        products[editingProdIndex].note = note;
        products[editingProdIndex].image = imgUrl;
        products[editingProdIndex].isHidden = isHidden;

        renderList();
        updateAdminStats();
        updateCustomerStats();
        manualSaveData();
        closeEditProdModal();
      }
    }

    function saveNewProd() {
      var name = document.getElementById('itemName').value.trim();
      var category = document.getElementById('itemCategory').value;
      var unitsStr = document.getElementById('itemUnits').value.trim();
      var note = document.getElementById('itemNote').value.trim();
      var imgUrl = document.getElementById('itemImage').value.trim();
      
      if (!name) { alert('請填寫商品名稱！'); return; }
      
      var unitsArr = unitsStr ? unitsStr.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean) : ['個'];

      products.unshift({ id: Date.now(), name: name, buyers: [], category: category, units: unitsArr, note: note, image: imgUrl, purchasedCounts: {}, isCompleted: false, isHidden: false });
      renderList();
      updateAdminStats();
      updateCustomerStats();
      manualSaveData();
      
      document.getElementById('itemName').value = '';
      document.getElementById('itemNote').value = '';
      document.getElementById('itemImage').value = '';
      document.getElementById('itemUnits').value = '盒,片';
      
      switchTab(1);
    }

    function switchTab(tabNum) {
      document.getElementById('tabBtn1').className = 'admin-tab-btn' + (tabNum === 1 ? ' active' : '');
      document.getElementById('tabBtn2').className = 'admin-tab-btn' + (tabNum === 2 ? ' active' : '');
      document.getElementById('tabBtn3').className = 'admin-tab-btn' + (tabNum === 3 ? ' active' : '');
      document.getElementById('tabBtn4').className = 'admin-tab-btn' + (tabNum === 4 ? ' active' : '');

      document.getElementById('adminSec1').className = 'admin-section' + (tabNum === 1 ? ' active' : '');
      document.getElementById('adminSec2').className = 'admin-section' + (tabNum === 2 ? ' active' : '');
      document.getElementById('adminSec3').className = 'admin-section' + (tabNum === 3 ? ' active' : '');
      document.getElementById('adminSec4').className = 'admin-section' + (tabNum === 4 ? ' active' : '');

      if (tabNum === 1) {
        updateAdminStats();
      } else if (tabNum === 2) {
        updateCustomerStats();
      }
    }

    renderList();
  </script>
</body>
</html>
