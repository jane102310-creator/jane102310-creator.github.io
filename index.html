<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待購選物清單</title>
  <style>
    :root {
      --bg: #FDFBF7;
      --card: #FFFFFF;
      --text: #5A4D41;
      --sub: #8C705F;
      --accent: #8C705F;
      --accent-light: #F4EBE1;
      --border: #EFECE6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 100px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header h1 { font-size: 18px; color: var(--text); }
    .btn-main { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid var(--border); }
    .item-title { font-weight: 600; font-size: 15px; margin-top: 4px; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--accent-light); color: var(--sub); display: inline-block; }
    .tag-buyer { background: #E8E2D8; color: var(--text); margin-left: 4px; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; justify-content:center; align-items:flex-end; z-index:99; }
    .modal.active { display:flex; }
    .modal-box { background:#fff; width:100%; max-width:480px; padding:20px; border-radius:20px 20px 0 0; }
    .input { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; margin:8px 0 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>待購選物清單</h1>
      <button class="btn-main" onclick="openAdmin()">🔐 管理者後台</button>
    </div>
    <div id="list"></div>
  </div>

  <div class="modal" id="buyModal">
    <div class="modal-box">
      <h3>新增登記購買</h3>
      <input type="text" id="buyerInput" class="input" placeholder="請輸入您的名字..." />
      <button class="btn-main" style="width:100%; padding:12px;" onclick="saveBuy()">確認登記</button>
      <button class="btn-main" style="width:100%; padding:10px; background:#ccc; margin-top:8px;" onclick="closeModal()">取消</button>
    </div>
  </div>

  <div class="modal" id="adminModal">
    <div class="modal-box">
      <h3>🔐 新增商品</h3>
      <input type="text" id="prodName" class="input" placeholder="商品名稱..." />
      <button class="btn-main" style="width:100%; padding:12px;" onclick="saveProd()">確認新增</button>
      <button class="btn-main" style="width:100%; padding:10px; background:#ccc; margin-top:8px;" onclick="closeAdmin()">關閉</button>
    </div>
  </div>

  <script>
    var items = [
      { name: '咖啡糖Americano', buyers: ['Jane'] },
      { name: '咖啡糖espresso', buyers: ['敏敏'] }
    ];

    try {
      var local = localStorage.getItem('my_buylist_data');
      if (local) { items = JSON.parse(local); }
    } catch(e){}

    var curIdx = -1;

    function render() {
      var el = document.getElementById('list');
      el.innerHTML = '';
      for (var i = 0; i < items.length; i++) {
        var bTags = '';
        for (var j = 0; j < items[i].buyers.length; j++) {
          bTags += '<span class="tag tag-buyer">' + items[i].buyers[j] + '</span>';
        }
        el.innerHTML += '<div class="card"><div><span class="tag">食品</span>' + bTags + '<div class="item-title">' + items[i].name + '</div></div><button class="btn-main" onclick="openBuy(' + i + ')">+ 購買</button></div>';
      }
      localStorage.setItem('my_buylist_data', JSON.stringify(items));
    }

    function openBuy(i) { curIdx = i; document.getElementById('buyModal').classList.add('active'); }
    function closeModal() { document.getElementById('buyModal').classList.remove('active'); }
    function saveBuy() {
      var val = document.getElementById('buyerInput').value.trim();
      if (val && curIdx >= 0) {
        items[curIdx].buyers.push(val);
        document.getElementById('buyerInput').value = '';
        closeModal();
        render();
      }
    }

    function openAdmin() { document.getElementById('adminModal').classList.add('active'); }
    function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }
    function saveProd() {
      var p = document.getElementById('prodName').value.trim();
      if (p) {
        items.unshift({ name: p, buyers: [] });
        document.getElementById('prodName').value = '';
        closeAdmin();
        render();
      }
    }

    render();
  </script>
</body>
</html>
