<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待購選物清單</title>
  <style>
    :root {
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #5A4D41;
      --text-sub: #8C705F;
      --accent: #8C705F;
      --accent-light: #F4EBE1;
      --border-color: #EFECE6;
      --shadow: 0 4px 16px rgba(90, 77, 65, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 120px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .header-title h1 { font-size: 20px; font-weight: 700; color: var(--text-main); }
    .btn-admin-main { background-color: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

    .item-card { background: var(--card-bg); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }
    .item-info { flex: 1; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
    .tag-category { background-color: var(--accent-light); color: var(--text-sub); }
    .tag-buyer { background-color: #E8E2D8; color: #5A4D41; cursor: pointer; }
    .item-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .item-note { font-size: 12px; color: #999; margin-top: 2px; }
    .btn-delete-item { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #CCC; font-size: 14px; cursor: pointer; padding: 4px; z-index: 2; }
    .btn-buy-action { background-color: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); display: block; }
    .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; background: #FAFAFA; outline: none; }
