<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jane代購清單</title>
  <style>
    :root {
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #5A4D41;
      --text-sub: #8C705F;
      --accent: #8C705F;
      --accent-light: #F4EBE1;
      --border-color: #EFECE6;
      --shadow: 0 4px 16px rgba(90, 77, 65, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 120px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 16px; text-align: center; }
    .header-title h1 { font-size: 22px; font-weight: 700; color: var(--text-main); }

    /* 分類篩選列 */
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); transition: all 0.2s; }
    .filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    .item-card { background: var(--card-bg); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }
    .item-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: #F4EBE1; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
    .tag-category { background-color: var(--accent-light); color: var(--text-sub); }
    .tag-buyer { background-color: #E8E2D8; color: #5A4D41; cursor: pointer; }
    .item-name { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-note { font-size: 12px; color: #999; margin-top: 2px; }
    .btn-buy-action { background-color: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

    .footer-admin-section { margin-top: 40px; text-align: center; padding: 20px; }
    .btn-footer-admin { background: none; border: 1px dashed var(--accent); color: var(--text-sub); padding: 10px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; opacity: 0.7; }
    .btn-footer-admin:hover { opacity: 1; background: var(--accent-light); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); display: block; }
    .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; background: #FAFAFA; outline: none; }
    .qty-modal-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0; }
    .btn-qty-lg { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-main); }
    .btn-qty-lg.plus { background: var(--accent); color: white; border: none; }
    .qty-display-lg { font-size: 24px; font-weight: bold; min-width: 40px; text-align: center; }
    .btn-submit { width: 100%; background-color: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-danger { background-color: #D9534F !important; margin-top: 8px; }

    .admin-nav { display: flex; gap: 10px; margin-bottom: 16px; }
    .admin-tab-btn { flex: 1; padding: 10px; border: none; background: #EFECE6; color: var(--text-sub); font-weight: 600; border-radius: 10px; cursor: pointer; }
    .admin-tab-btn.active { background: var(--accent); color: white; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-item-row { background: #FAFAFA; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; position: relative; }
    .admin-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
    .admin-item-info { flex: 1; min-width: 0; }
    .admin-item-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .admin-buyer-detail { font-size: 12px; color: var(--text-sub); }
    .admin-action-btns { display: flex; gap: 6px; margin-top: 6px; }
    .btn-edit-prod { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-del-prod { background: #D9534F; color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title"><h1>Jane代購清單</h1></div>
    </div>
    
    <!-- 分類篩選列 -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-pill active" onclick="setCategoryFilter('全部', this)">全部商品</button>
      <button class="filter-pill" onclick="setCategoryFilter('食品/食材', this)">食品/食材</button>
      <button class="filter-pill" onclick="setCategoryFilter('日用品', this)">日用品</button>
      <button class="filter-pill" onclick="setCategoryFilter('美妝保養', this)">美妝保養</button>
      <button class="filter-pill" onclick="setCategoryFilter('文具雜貨', this)">文具雜貨</button>
    </div>

    <div id="itemList"></div>

    <div class="footer-admin-section">
      <button class="btn-footer-admin" onclick="openAdminPortal()">管理者</button>
    </div>
  </div>

  <!-- 密碼登入 Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <div class="modal-header"><h2>🔐 管理者登入</h2><button class="btn-close" onclick="closeModal('loginModal')">✕</button></div>
      <div class="form-group">
        <label class="form-label">請輸入密碼</label>
        <input type="password" id="adminPwdInput" class="form-input" placeholder="預設密碼: 1234" />
      </div>
      <button class="btn-submit" onclick="submitLogin()">登入後台</button>
    </div>
  </div>

  <!-- 一般購買 Modal（支援單位） -->
  <div class="modal-overlay" id="qtyModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="editModalTitle">新增購買</h2><button class="btn-close" onclick="closeModal('qtyModal')">✕</button></div>
      <div class="form-group"><label class="form-label">購買人 / 登記人</label><input type="text" id="editBuyer" class="form-input" placeholder="例如：敏敏..." /></div>
      <div class="form-group">
        <label class="form-label">數量單位</label>
        <select id="editUnit" class="form-select"></select>
      </div>
      <div class="form-group"><label class="form-label">購買數量</label>
        <div class="qty-modal-controls">
          <button class="btn-qty-lg" onclick="changeQty(-1)">-</button>
          <span class="qty-display-lg" id="editQtyVal">1</span>
          <button class="btn-qty-lg plus" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <button class="btn-submit" onclick="saveNewBuy()">確認新增購買人</button>
    </div>
  </div>

  <!-- 修改購買數量 Modal -->
  <div class="modal-overlay" id="editBuyerModal">
    <div class="modal-content">
      <div class="modal-header"><h2>修改購買數量</h2><button class="btn-close" onclick="closeModal('editBuyerModal')">✕</button></div>
      <div class="form-group"><label class="form-label">購買人與單位</label><input type="text" id="existingBuyerName" class="form-input" readonly style="background:#eee;" /></div>
      <div class="form-group"><label class="form-label">購買數量</label>
        <div class="qty-modal-controls">
          <button class="btn-qty-lg" onclick="changeExistQty(-1)">-</button>
          <span class="qty-display-lg" id="existingQtyVal">1</span>
          <button class="btn-qty-lg plus" onclick="changeExistQty(1)">+</button>
        </div>
      </div>
      <button class="btn-submit" onclick="saveExistBuy()">儲存修改</button>
      <button class="btn-submit btn-danger" onclick="delExistBuy()">刪除此購買紀錄</button>
    </div>
  </div>

  <!-- 修改商品資料 Modal -->
  <div class="modal-overlay" id="editProdModal" style="z-index: 1100;">
    <div class="modal-content">
      <div class="modal-header"><h2>✏️ 修改商品資料</h2><button class="btn-close" onclick="closeEditProdModal()">✕</button></div>
      <div class="form-group"><label class="form-label">商品名稱 *</label><input type="text" id="editProdName" class="form-input" /></div>
      <div class="form-group"><label class="form-label">分類</label>
        <select id="editProdCategory" class="form-select">
          <option value="食品/食材">食品/食材</option>
          <option value="日用品">日用品</option>
          <option value="美妝保養">美妝保養</option>
          <option value="文具雜貨">文具雜貨</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">數量單位（多個單位請用逗號隔開，例如：盒,片）</label><input type="text" id="editProdUnits" class="form-input" placeholder="盒,片" /></div>
      <div class="form-group"><label class="form-label">商品圖片</label>
        <input type="file" id="editProdImageFile" class="form-input" accept="image/*" style="margin-bottom: 6px;" onchange="handleEditImg(event)" />
        <input type="text" id="editProdImage" class="form-input" placeholder="圖片網址 (URL)..." />
      </div>
      <div class="form-group"><label class="form-label">備註說明</label><input type="text" id="editProdNote" class="form-input" /></div>
      <button class="btn-submit" onclick="saveEditProd()">儲存商品修改</button>
    </div>
  </div>

  <!-- 管理者後台 Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <div class="modal-header"><h2>🔐 管理者後台</h2><button class="btn-close" onclick="closeModal('adminModal')">✕</button></div>
      
      <div class="admin-nav">
        <button class="admin-tab-btn active" id="tabBtn1" onclick="switchTab(1)">📦 總數量統計</button>
        <button class="admin-tab-btn" id="tabBtn2" onclick="switchTab(2)">➕ 新增商品</button>
      </div>

      <div class="admin-section active" id="adminSec1">
        <div id="adminContentList" style="max-height: 50vh; overflow-y: auto; margin-bottom: 16px;"></div>
      </div>

      <div class="admin-section" id="adminSec2">
        <div class="form-group"><label class="form-label">商品名稱 *</label><input type="text" id="itemName" class="form-input" placeholder="例如：積雪草面膜..." /></div>
        <div class="form-group"><label class="form-label">分類</label>
          <select id="itemCategory" class="form-select">
            <option value="食品/食材">食品/食材</option>
            <option value="日用品">日用品</option>
            <option value="美妝保養">美妝保養</option>
            <option value="文具雜貨">文具雜貨</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">數量單位（多個單位請用逗號隔開，例如：盒,片）</label><input type="text" id="itemUnits" class="form-input" value="盒,片" placeholder="盒,片" /></div>
        <div class="form-group"><label class="form-label">商品圖片</label>
          <input type="file" id="itemImageFile" class="form-input" accept="image/*" style="margin-bottom: 6px;" onchange="handleNewImg(event)" />
          <input type="text" id="itemImage" class="form-input" placeholder="或直接貼上圖片網址 (URL)..." />
        </div>
        <div class="form-group"><label class="form-label">備註說明</label><input type="text" id="itemNote" class="form-input" placeholder="規格或口味..." /></div>
        <button class="btn-submit" onclick="saveNewProd()">確認新增商品</button>
      </div>
    </div>
  </div>

  <script>
    var currentEditIndex = null;
    var tempEditQty = 1;
    var currentItemIndex = null;
    var currentBuyerIndex = null;
    var tempExistingQty = 1;
    var tempUploadedImg = '';
    var tempEditUploadedImg = '';
    var editingProdIndex = null;
    var isAuthed = false;
    var currentCategoryFilter = '全部';
    var ADMIN_PASSWORD = '1234';

    var defaultProducts = [
      { id: 1, name: '咖啡糖Americano', buyers: [{name: 'Jane', count: 1, unit: '包'}], category: '食品/食材', units: ['包', '個'], note: '', image: '' },
      { id: 2, name: '積雪草面膜', buyers: [{name: '敏敏', count: 1, unit: '盒'}, {name: '敏敏', count: 5, unit: '片'}], category: '美妝保養', units: ['盒', '片'], note: '', image: '' }
    ];

    var products = defaultProducts;

    try {
      var saved = localStorage.getItem('buylist_v17_products');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) { products = parsed; }
      }
    } catch(e) {
      products = defaultProducts;
    }

    function setCategoryFilter(category, btnElement) {
      currentCategoryFilter = category;
      var pills = document.querySelectorAll('.filter-pill');
      pills.forEach(function(p) { p.classList.remove('active'); });
      btnElement.classList.add('active');
      renderList();
    }

    function renderList() {
      var itemList = document.getElementById('itemList');
      if (!itemList) return;
      itemList.innerHTML = '';

      for (var i = 0; i < products.length; i++) {
        var product = products[i];
        if (!product.buyers) product.buyers = [];
        if (!product.units || !Array.isArray(product.units)) product.units = ['個'];

        if (currentCategoryFilter !== '全部' && product.category !== currentCategoryFilter) {
          continue;
        }

        var card = document.createElement('div');
        card.className = 'item-card';

        var buyerTagsHTML = '';
        for (var j = 0; j < product.buyers.length; j++) {
          var b = product.buyers[j];
          var unitStr = b.unit ? b.unit : '';
          buyerTagsHTML += '<span class="tag tag-buyer" onclick="openEditBuyerModal(' + i + ', ' + j + ')">' + b.name + ' +' + b.count + unitStr + '</span>';
        }

        var defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        var imgSrc = product.image ? product.image : defaultSvg;

        card.innerHTML = '<img src="' + imgSrc + '" class="item-img" alt="商品圖片" />' +
          '<div class="item-info">' +
            '<div class="item-tags"><span class="tag tag-category">' + product.category + '</span>' + buyerTagsHTML + '</div>' +
            '<div class="item-name">' + product.name + '</div>' +
            (product.note ? '<div class="item-note">' + product.note + '</div>' : '') +
          '</div>' +
          '<button class="btn-buy-action" onclick="openQtyModal(' + i + ')">+ 購買</button>';
        
        itemList.appendChild(card);
      }
      try {
        localStorage.setItem('buylist_v17_products', JSON.stringify(products));
      } catch(e) {}
    }

    function openAdminPortal() {
      if (isAuthed) {
        updateAdminStats();
        document.getElementById('adminModal').classList.add('active');
      } else {
        document.getElementById('adminPwdInput').value = '';
        document.getElementById('loginModal').classList.add('active');
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function submitLogin() {
      var pwd = document.getElementById('adminPwdInput').value;
      if (pwd === ADMIN_PASSWORD) {
        isAuthed = true;
        closeModal('loginModal');
        updateAdminStats();
        document.getElementById('adminModal').classList.add('active');
      } else {
        alert('密碼錯誤！');
      }
    }

    function openQtyModal(index) {
      currentEditIndex = index;
      var product = products[index];
      document.getElementById('editModalTitle').innerText = '新增購買：' + product.name;
      document.getElementById('editBuyer').value = '';
      
      var unitSelect = document.getElementById('editUnit');
      unitSelect.innerHTML = '';
      var units = product.units && product.units.length > 0 ? product.units : ['個'];
      for (var u = 0; u < units.length; u++) {
        var opt = document.createElement('option');
        opt.value = units[u];
        opt.innerText = units[u];
        unitSelect.appendChild(opt);
      }

      tempEditQty = 1;
      document.getElementById('editQtyVal').innerText = tempEditQty;
      document.getElementById('qtyModal').classList.add('active');
    }

    function changeQty(val) {
      tempEditQty += val;
      if (tempEditQty < 1) tempEditQty = 1;
      document.getElementById('editQtyVal').innerText = tempEditQty;
    }

    function saveNewBuy() {
      if (currentEditIndex !== null) {
        var buyerName = document.getElementById('editBuyer').value.trim();
        var selectedUnit = document.getElementById('editUnit').value;
        if (!buyerName) { alert('請輸入購買人姓名！'); return; }
        products[currentEditIndex].buyers.push({ name: buyerName, count: tempEditQty, unit: selectedUnit });
        renderList();
        closeModal('qtyModal');
      }
    }

    function openEditBuyerModal(itemIdx, buyerIdx) {
      currentItemIndex = itemIdx;
      currentBuyerIndex = buyerIdx;
      var buyerObj = products[itemIdx].buyers[buyerIdx];
      var unitStr = buyerObj.unit ? buyerObj.unit : '';
      document.getElementById('existingBuyerName').value = buyerObj.name + ' (' + unitStr + ')';
      tempExistingQty = buyerObj.count;
      document.getElementById('existingQtyVal').innerText = tempExistingQty;
      document.getElementById('editBuyerModal').classList.add('active');
    }

    function changeExistQty(val) {
      tempExistingQty += val;
      if (tempExistingQty < 0) tempExistingQty = 0;
      document.getElementById('existingQtyVal').innerText = tempExistingQty;
    }

    function saveExistBuy() {
      if (currentItemIndex !== null && currentBuyerIndex !== null) {
        if (tempExistingQty === 0) {
          products[currentItemIndex].buyers.splice(currentBuyerIndex, 1);
        } else {
          products[currentItemIndex].buyers[currentBuyerIndex].count = tempExistingQty;
        }
        renderList();
        closeModal('editBuyerModal');
      }
    }

    function delExistBuy() {
      if (currentItemIndex !== null && currentBuyerIndex !== null) {
        if (confirm('確定要刪除這位購買人的紀錄嗎？')) {
          products[currentItemIndex].buyers.splice(currentBuyerIndex, 1);
          renderList();
          closeModal('editBuyerModal');
        }
      }
    }

    function deleteItemFromAdmin(i) {
      if (confirm('確定要從清單中徹底刪除這個商品嗎？')) {
        products.splice(i, 1);
        renderList();
        updateAdminStats();
      }
    }

    function updateAdminStats() {
      var contentList = document.getElementById('adminContentList');
      if (!contentList) return;
      contentList.innerHTML = '';
      var grandTotal = 0;

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var itemTotal = 0;
        var buyersHtml = '';
        if (p.buyers && p.buyers.length > 0) {
          for (var j = 0; j < p.buyers.length; j++) {
            var b = p.buyers[j];
            itemTotal += b.count;
            var unitStr = b.unit ? b.unit : '';
            buyersHtml += '<div class="admin-buyer-detail">👤 ' + b.name + ': <b>' + b.count + '</b> ' + unitStr + '</div>';
          }
        } else {
          buyersHtml = '<div class="admin-buyer-detail" style="color:#aaa;">尚無人登記購買</div>';
        }
        grandTotal += itemTotal;

        var defaultThumb = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        var thumbSrc = p.image ? p.image : defaultThumb;
        var unitsText = p.units ? p.units.join(',') : '個';

        var row = document.createElement('div');
        row.className = 'admin-item-row';
        row.innerHTML = '<img src="' + thumbSrc + '" class="admin-thumb" alt="" />' +
          '<div class="admin-item-info">' +
            '<div class="admin-item-title"><span>📦 ' + p.name + ' <small style="color:var(--text-sub);">(' + unitsText + ')</small></span></div>' +
            buyersHtml +
            '<div class="admin-action-btns">' +
              '<button class="btn-edit-prod" onclick="openEditProdModal(' + i + ')">✏️ 編輯</button>' +
              '<button class="btn-del-prod" onclick="deleteItemFromAdmin(' + i + ')">🗑️ 刪除</button>' +
            '</div>' +
          '</div>';
        contentList.appendChild(row);
      }

      var summaryHeader = document.createElement('div');
      summaryHeader.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color); color:var(--text-main);";
      summaryHeader.innerText = '📊 總登記筆數：' + grandTotal + ' 筆';
      contentList.insertBefore(summaryHeader, contentList.firstChild);
    }

    function openEditProdModal(index) {
      editingProdIndex = index;
      var p = products[index];
      document.getElementById('editProdName').value = p.name;
      document.getElementById('editProdCategory').value = p.category || '食品/食材';
      document.getElementById('editProdUnits').value = p.units ? p.units.join(',') : '盒,片';
      document.getElementById('editProdNote').value = p.note || '';
      document.getElementById('editProdImage').value = p.image || '';
      document.getElementById('editProdImageFile').value = '';
      tempEditUploadedImg = '';
      document.getElementById('editProdModal').classList.add('active');
    }

    function closeEditProdModal() {
      document.getElementById('editProdModal').classList.remove('active');
    }

    function handleEditImg(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(event) {
          tempEditUploadedImg = event.target.result;
          document.getElementById('editProdImage').value = '[已選擇本機圖片]';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveEditProd() {
      if (editingProdIndex !== null) {
        var name = document.getElementById('editProdName').value.trim();
        var category = document.getElementById('editProdCategory').value;
        var unitsStr = document.getElementById('editProdUnits').value.trim();
        var note = document.getElementById('editProdNote').value.trim();
        var imgUrl = document.getElementById('editProdImage').value.trim();

        if (!name) { alert('請填寫商品名稱！'); return; }

        var unitsArr = unitsStr ? unitsStr.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean) : ['個'];

        var finalImg = products[editingProdIndex].image;
        if (tempEditUploadedImg) {
          finalImg = tempEditUploadedImg;
        } else if (imgUrl && imgUrl !== '[已選擇本機圖片]') {
          finalImg = imgUrl;
        } else if (!imgUrl) {
          finalImg = '';
        }

        products[editingProdIndex].name = name;
        products[editingProdIndex].category = category;
        products[editingProdIndex].units = unitsArr;
        products[editingProdIndex].note = note;
        products[editingProdIndex].image = finalImg;

        renderList();
        updateAdminStats();
        closeEditProdModal();
      }
    }

    function handleNewImg(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(event) {
          tempUploadedImg = event.target.result;
          document.getElementById('itemImage').value = '[已選擇本機圖片]';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveNewProd() {
      var name = document.getElementById('itemName').value.trim();
      var category = document.getElementById('itemCategory').value;
      var unitsStr = document.getElementById('itemUnits').value.trim();
      var note = document.getElementById('itemNote').value.trim();
      var imgUrl = document.getElementById('itemImage').value.trim();
      
      if (!name) { alert('請填寫商品名稱！'); return; }
      
      var unitsArr = unitsStr ? unitsStr.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean) : ['個'];

      var finalImg = '';
      if (tempUploadedImg) {
        finalImg = tempUploadedImg;
      } else if (imgUrl && imgUrl !== '[已選擇本機圖片]') {
        finalImg = imgUrl;
      }

      products.unshift({ id: Date.now(), name: name, buyers: [], category: category, units: unitsArr, note: note, image: finalImg });
      renderList();
      updateAdminStats();
      
      document.getElementById('itemName').value = '';
      document.getElementById('itemNote').value = '';
      document.getElementById('itemImage').value = '';
      document.getElementById('itemImageFile').value = '';
      document.getElementById('itemUnits').value = '盒,片';
      tempUploadedImg = '';
      
      switchTab(1);
    }

    function switchTab(tabNum) {
      if (tabNum === 1) {
        document.getElementById('tabBtn1').className = 'admin-tab-btn active';
        document.getElementById('tabBtn2').className = 'admin-tab-btn';
        document.getElementById('adminSec1').className = 'admin-section active';
        document.getElementById('adminSec2').className = 'admin-section';
        updateAdminStats();
      } else {
        document.getElementById('tabBtn2').className = 'admin-tab-btn active';
        document.getElementById('tabBtn1').className = 'admin-tab-btn';
        document.getElementById('adminSec2').className = 'admin-section active';
        document.getElementById('adminSec1').className = 'admin-section';
      }
    }

    renderList();
  </script>
</body>
</html>
