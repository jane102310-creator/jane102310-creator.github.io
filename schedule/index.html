}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A221C; --surface:#352B24; --ink:#F3E7D6; --muted:#B9A48E; --line:#4A3D33;

function parse(code){
  if(!code||code==='-')return{kind:'none'};
  let mark='';const pm=/^(W\+|N\+)/.exec(code);if(pm){mark=pm[1];code=code.slice(2)}
  for(const k of Object.keys(SHIFT).sort((a,b)=>b.length-a.length)){
    if(code.startsWith(k))return{kind:'work',base:k,tag:code.slice(k.length),mark,...SHIFT[k]};
  }
  const up=code.replace(/^ss/,'SS');
  const off=up.startsWith('SS')?(up==='SS'?'其他假':up):(OFF[up]||up);
  return{kind:'off',label:off};
}
function dayData(i){
  const out={night:[],day:{},eve:{},off:{},tonight:[],tonightKnown:i+1<N};
  PEOPLE.forEach(p=>{
    const c=parse(p.days[i]);
    if(c.kind==='work'){
      const e={name:p.name,tag:c.tag,mark:c.mark};
      if(c.g==='night')out.night.push(e);else (out[c.g][c.base]??=[]).push(e);
    }else if(c.kind==='off')(out.off[c.label]??=[]).push({name:p.name});
    if(i+1<N){const n=parse(p.days[i+1]);if(n.kind==='work'&&n.g==='night')out.tonight.push({name:p.name,tag:n.tag,mark:n.mark})}
  });
  return out;
}
const person=x=>`<span class="p">${x.name}${x.tag?`<i>${pretty(x.tag)}</i>`:''}${x.mark?`<span class="wplus">${x.mark}</span>`:''}</span>`;
function rows(map,cls){
  const keys=Object.keys(map).sort((a,b)=>(SHIFT[a]?.o??0)-(SHIFT[b]?.o??0));
  if(!keys.length)return`<div class="empty">沒有人</div>`;
  return keys.map(k=>`<div class="grp ${cls}"><div class="code"><b>${pretty(k)}</b>${SHIFT[k]?`<small>${SHIFT[k].t}</small>`:''}</div><div class="names">${map[k].map(person).join('')}</div></div>`).join('');
}
function single(list,code,time,cls,emptyTxt){
  if(!list.length)return`<div class="empty">${emptyTxt}</div>`;
  return`<div class="grp ${cls}"><div class="code"><b>${code}</b><small>${time}</small></div><div class="names">${list.map(person).join('')}</div></div>`;
}
const count=m=>Object.values(m).reduce((a,b)=>a+b.length,0);

let sel=0;
function render(){
  const T=DAYS[sel],D=dayData(sel);
  $('title').innerHTML=`${T.m}/${T.d}<small>星期${WK[T.wd]}</small>`;
  $('prev').disabled=sel<=0;$('next').disabled=sel>=N-1;
  document.querySelectorAll('.d').forEach(b=>{const on=+b.dataset.i===sel;b.classList.toggle('sel',on);b.setAttribute('aria-selected',on)});
  const prevDay=sel===0?'10/31':label(sel-1);
  const nextDay=sel+1<N?label(sel+1):'1/1';
  const offSorted=Object.entries(D.off).sort((a,b)=>{const ia=OFF_ORDER.indexOf(a[0]),ib=OFF_ORDER.indexOf(b[0]);return(ia<0?9:ia)-(ib<0?9:ib)});
  const offRows=offSorted.length?offSorted.map(([k,v])=>`<div class="grp off"><div class="code"><b>${k}</b></div><div class="names">${v.map(person).join('')}</div></div>`).join(''):`<div class="empty">沒有人休假</div>`;
  $('main').innerHTML=`
  <div class="sum">
    <div class="s-day"><b>${count(D.day)}</b><span>白班</span></div>
    <div class="s-eve"><b>${count(D.eve)}</b><span>小夜</span></div>
    <div class="s-night"><b>${D.night.length}</b><span>大夜</span></div>
    <div class="s-off"><b>${count(D.off)}</b><span>放假</span></div>
  </div>
  <section><div class="sh"><h2>凌晨大夜</h2><span>${prevDay} 晚上 24:00 接班，做到早上 08:30</span></div>
    <div class="list">${single(D.night,'PH','00:00–08:30','night',sel===0?'10/31 晚上的大夜在 10 月班表':'沒有排大夜')}</div></section>
  <section><div class="sh"><h2>白班</h2><span>依上班時間排序</span></div>
    <div class="list">${rows(D.day,'day')}</div></section>
  <section><div class="sh"><h2>小夜</h2></div>
    <div class="list">${rows(D.eve,'eve')}</div></section>
  <section><div class="sh"><h2>今晚接大夜</h2><span>${nextDay} 的 PH，今晚 24:00 上班</span></div>
    <div class="list">${D.tonightKnown?single(D.tonight,'PH',`${nextDay} 00:00`,'night','沒有排大夜'):'<div class="empty">1/1 的 PH 在明年 1 月班表</div>'}</div></section>
  <section><div class="sh"><h2>放假</h2></div>
    <div class="list">${offRows}</div></section>
  <p class="note">名字旁的小字是班表上的註記，例如 L、點、加、(12.13)。<b>W+</b> 是休假日出勤，<b>N+</b> 是國定假日出勤。<br>這份資料是從班表截圖抄錄的，若和系統班表不同，以 HR 排班資料為準。</p>`;
  const chip=document.querySelector(`.d[data-i="${sel}"]`);chip&&chip.scrollIntoView({inline:'center',block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  try{history.replaceState(null,'','#d'+String(T.m).padStart(2,'0')+String(T.d).padStart(2,'0'))}catch(e){}
}
DAYS.forEach((x,i)=>{
  if(x.d===1){const l=document.createElement('span');l.className='mlab';l.textContent=x.m+'月';$('strip').appendChild(l)}
  const b=document.createElement('button');b.dataset.i=i;
  b.className='d'+(x.wd===0||x.wd===6?' we':'');b.setAttribute('role','tab');
  b.innerHTML=`<small>${WK[x.wd]}</small><b>${x.d}</b>`;b.onclick=()=>{sel=i;render()};$('strip').appendChild(b);
});
function todayIdx(){const n=new Date();const i=DAYS.findIndex(x=>x.m===n.getMonth()+1&&x.d===n.getDate()&&n.getFullYear()===2026);return i<0?null:i}
const t=todayIdx();if(t!==null)document.querySelector(`.d[data-i="${t}"]`).classList.add('now');
$('todayBtn').onclick=()=>{sel=t??0;render()};
$('prev').onclick=()=>{if(sel>0){sel--;render()}};
$('next').onclick=()=>{if(sel<N-1){sel++;render()}};
let sx=null,sy=null;
$('main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('main').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&sel<N-1)sel++;else if(dx>0&&sel>0)sel--;render()}sx=null},{passive:true});
function fromHash(){const m=/^#d(\d{2})(\d{2})$/.exec(location.hash);if(!m)return null;const i=DAYS.findIndex(x=>x.m===+m[1]&&x.d===+m[2]);return i<0?null:i}
sel=fromHash()??t??0;
addEventListener('hashchange',()=>{const i=fromHash();if(i!==null&&i!==sel){sel=i;render()}});
render();
</script>

</body></html>
