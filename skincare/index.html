<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F1EEE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的保養品專區</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EEE7; --card:#F8F6F1; --text:#3E3731; --sub:#857B71; --muted:#B0A79C;
    --accent:#4A4038; --line:#DDD7CC; --line2:#E8E3DA;
    --beige:#ECE4D8; --sage:#E1E4DA;
    --ok:#8FA287; --warn:#C9A06A; --bad:#C08378;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);padding:30px 20px 120px;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:540px;margin:0 auto}
  header{padding:0 2px 22px}
  header .en{font-size:11px;letter-spacing:.42em;color:var(--sub)}
  header h1{font-family:var(--serif);font-size:30px;font-weight:700;margin-top:14px;letter-spacing:.02em}
  header p{font-size:13.5px;color:var(--sub);margin-top:10px;letter-spacing:.06em}
  .sync::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:2px}
  .sync.on::before{background:var(--ok)} .sync.err{color:var(--bad)} .sync.err::before{background:var(--bad)}

  .stats{border:1.5px solid var(--accent);border-radius:12px;padding:5px;margin-bottom:14px;background:var(--card)}
  .stats-in{border:1px solid var(--line);border-radius:8px;padding:16px 6px 14px;display:grid;grid-template-columns:repeat(4,1fr)}
  .stats .lab{grid-column:1/-1;text-align:center;font-size:10.5px;letter-spacing:.38em;color:var(--sub);margin-bottom:10px}
  .stat{text-align:center;cursor:pointer;position:relative}
  .stat+.stat::before{content:"";position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--line2)}
  .stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1}
  .stat span{font-size:11.5px;color:var(--sub);margin-top:4px;display:block;letter-spacing:.06em}
  .stat.warnc b{color:var(--bad)}
  .stat.active span{color:var(--text);text-decoration:underline;text-underline-offset:4px}

  .tools{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:6px}
  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
  .search::placeholder{color:var(--muted)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:5px 11px;border-radius:5px;border:1px solid var(--line);font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;background:transparent}
  .chip.on{border-color:var(--accent);color:var(--accent);background:var(--beige);font-weight:600}
  .row-label{font-size:10.5px;color:var(--muted);margin:14px 0 0;letter-spacing:.3em}
  .sortrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);font-size:12px;color:var(--sub)}
  .sortrow select{border:none;background:transparent;color:var(--text);font-size:12.5px;font-family:inherit}

  .brand-group h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .brand-group h2 span:last-child{font-family:-apple-system,sans-serif;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.2em}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .item.s-ok{background:var(--sage)} .item.s-warn,.item.s-bad{background:var(--beige)}
  .item-top{padding:16px 16px 14px;cursor:pointer}
  .item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .brand{font-size:11.5px;color:var(--sub);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
  .s-ok .dot{background:var(--ok)} .s-warn .dot{background:var(--warn)} .s-bad .dot{background:var(--bad)}
  .name{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:6px;line-height:1.4}
  .cat{flex:none;font-size:12px;color:var(--accent);border:1.5px solid var(--accent);padding:2px 9px;border-radius:5px;letter-spacing:.1em}
  .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(62,55,49,.12)}
  .tag{font-size:12.5px;color:var(--sub)}
  .tag em{font-style:normal;color:var(--muted);margin-right:5px;font-size:11px;letter-spacing:.1em}
  .tag.warn{color:#A9793E} .tag.bad{color:#A65E52} .tag.ok{color:var(--text)}
  .bar{height:2px;background:rgba(62,55,49,.1);margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}

  .detail{display:none;padding:2px 16px 16px;background:var(--card);border-top:1px solid var(--line)}
  .item.open .detail{display:block}
  .detail h4{font-size:10.5px;color:var(--sub);margin:16px 0 6px;letter-spacing:.3em;font-weight:500}
  .detail p{font-size:14.5px;line-height:1.85;white-space:pre-wrap}
  .detail p.empty{color:var(--muted);font-size:13px}
  .stock-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
  .stock-ctl .lbl{font-size:13px;color:var(--sub)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--text);cursor:pointer;line-height:1}
  .qty span{min-width:30px;text-align:center;font-family:var(--serif);font-size:17px}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);border-radius:7px;padding:9px 14px;font-size:13px;cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;letter-spacing:.04em}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#F8F6F1}
  .btn.ghost{background:transparent;color:var(--sub)}
  .btn.danger{border-color:transparent;background:transparent;color:var(--bad)}
  .empty-state{text-align:center;color:var(--muted);padding:56px 10px;font-size:13.5px;line-height:2;font-family:var(--serif)}

  .fab{position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#F8F6F1;font-size:26px;font-weight:200;border:none;box-shadow:0 6px 18px rgba(62,55,49,.25);cursor:pointer;z-index:10}

  .modal-bg{position:fixed;inset:0;background:rgba(62,55,49,.3);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:16px}}
  .modal h3{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
  .x{border:none;background:none;font-size:24px;color:var(--sub);cursor:pointer;font-weight:200}
  .f{margin-bottom:14px}
  .f label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.06em}
  .f label small{color:var(--muted)}
  .f input,.f select,.f textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--card);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
  .f textarea{min-height:80px;resize:vertical;line-height:1.65}
  .hintbtn{font-size:11.5px;color:var(--accent);background:none;border:none;cursor:pointer;float:right;text-decoration:underline;text-underline-offset:3px;font-family:inherit}
  .footer-tools{margin-top:32px;text-align:center;display:flex;gap:6px;justify-content:center}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.8}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--accent);color:#F8F6F1;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .two .f{min-width:0}
  .f input[type=date]{display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
  .f input[type=date]::-webkit-date-and-time-value{text-align:left}
  .combo{position:relative}
  .combo input{padding-right:40px}
  .combo .arrow{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer}
  .combo-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(62,55,49,.12);max-height:240px;overflow-y:auto;z-index:5;padding:6px}
  .combo.open .combo-list{display:block}
  .opt{padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .opt:active,.opt.hl{background:var(--bg)}
  .opt small{color:var(--muted);font-size:11px;flex:none}
  .opt.new{color:var(--sub)}
  .pastebar{width:100%;margin-bottom:16px;padding:12px;border:1px dashed var(--muted);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
  .opt-sep{font-size:10px;letter-spacing:.2em;color:var(--muted);padding:8px 12px 4px}
  .hintbtn{font-size:11.5px;color:var(--text);background:none;border:none;cursor:pointer;float:right;text-decoration:underline;text-underline-offset:3px;font-family:inherit}
  .footer-tools{margin-top:32px;text-align:center;display:flex;gap:6px;justify-content:center}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="en">나의 스킨케어 — MY SKINCARE</div>
    <h1>我的保養品 小日記</h1>
    <p><span id="today"></span>　<span id="sync" class="sync">連線中…</span></p>
  </header>

  <div class="stats"><div class="stats-in">
    <div class="lab">MY SHELF ・ 화장대</div>
    <div class="stat" data-f="all"><b id="sTypes">0</b><span>品項</span></div>
    <div class="stat" data-f="all"><b id="sBottles">0</b><span>總瓶數</span></div>
    <div class="stat" data-f="opened"><b id="sOpened">0</b><span>使用中</span></div>
    <div class="stat warnc" data-f="alert"><b id="sAlert">0</b><span>快過期/缺貨</span></div>
  </div></div>

  <div class="tools">
    <input class="search" id="q" placeholder="搜尋品牌、品名、功效">
    <div class="row-label">상태 STATUS</div>
    <div class="chips" id="statusChips"></div>
    <div class="row-label">브랜드 BRAND</div>
    <div class="chips" id="brandChips"></div>
    <div class="row-label">종류 CATEGORY</div>
    <div class="chips" id="catChips"></div>
    <div class="sortrow">
      <span id="count"></span>
      <select id="sort">
        <option value="brand">依品牌分組</option>
        <option value="expire">依到期日（最急的在前）</option>
        <option value="opened">依開瓶日（最新在前）</option>
        <option value="stock">依庫存（最少在前）</option>
      </select>
    </div>
  </div>

  <div id="list"></div>

  <div class="footer-tools">
    <button class="btn ghost" id="exportBtn">備份資料</button>
    <button class="btn ghost" id="importBtn">匯入備份</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <p class="note">資料已同步到雲端，手機和電腦打開這個網址都會看到一樣的內容。<br>「備份資料」可以另外存一份檔案，以防萬一。</p>
</div>

<button class="fab" id="addBtn" aria-label="新增保養品">＋</button>

<div class="modal-bg" id="modalBg">
  <form class="modal" id="form" autocomplete="off">
    <h3><span id="formTitle">新增保養品</span><button type="button" class="x" id="closeBtn">×</button></h3>
    <input type="hidden" id="fId">
    <button type="button" class="pastebar" id="pasteBtn">貼上 Claude 給的保養品代碼，自動填寫</button>
    <div class="f">
      <label>品牌 *</label>
      <div class="combo" id="cBrand">
        <input id="fBrand" required placeholder="點選或輸入品牌" autocomplete="off">
        <button type="button" class="arrow" tabindex="-1">▼</button>
        <div class="combo-list"></div>
      </div>
    </div>
    <div class="f">
      <label>品名 *</label>
      <div class="combo" id="cName">
        <input id="fName" required placeholder="點選或輸入品名" autocomplete="off">
        <button type="button" class="arrow" tabindex="-1">▼</button>
        <div class="combo-list"></div>
      </div>
    </div>
    <div class="two">
      <div class="f">
        <label>類別</label>
        <select id="fCat"></select>
      </div>
      <div class="f">
        <label>容量 <small>(選填)</small></label>
        <input id="fSize" placeholder="例：50ml">
      </div>
    </div>
    <div class="two">
      <div class="f">
        <label>開瓶日 <small>(沒開就留空)</small></label>
        <input type="date" id="fOpen">
      </div>
      <div class="f">
        <label>開封後可用 <small>(PAO)</small></label>
        <select id="fPao">
          <option value="3">3 個月</option>
          <option value="6">6 個月</option>
          <option value="9">9 個月</option>
          <option value="12" selected>12 個月</option>
          <option value="18">18 個月</option>
          <option value="24">24 個月</option>
          <option value="36">36 個月</option>
        </select>
      </div>
    </div>
    <div class="two">
      <div class="f">
        <label>未開封庫存 <small>(瓶)</small></label>
        <input type="number" id="fStock" min="0" value="0" inputmode="numeric">
      </div>
      <div class="f">
        <label>有效期限 <small>(選填)</small></label>
        <input type="date" id="fExp">
      </div>
    </div>
    <div class="f">
      <label>如何使用 <button type="button" class="hintbtn" data-hint="use">帶入常見用法</button></label>
      <textarea id="fUse" placeholder="例：早晚洗臉後，取適量均勻塗抹全臉…"></textarea>
    </div>
    <div class="f">
      <label>功效 <button type="button" class="hintbtn" data-hint="eff">帶入常見功效</button></label>
      <textarea id="fEff" placeholder="例：保濕、修護、舒緩泛紅…"></textarea>
    </div>
    <div class="f">
      <label>備註 <small>(選填，例：購買地點、價格、使用心得)</small></label>
      <textarea id="fNote" style="min-height:56px"></textarea>
    </div>
    <div class="actions" style="justify-content:flex-end">
      <button type="button" class="btn danger" id="delBtn" style="margin-right:auto;display:none">刪除</button>
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'skincare-items-v1';
const CATS = ['洗面乳','卸妝','化妝水','精華液','安瓶','乳液','面霜','眼霜','防曬','面膜','身體保養','護唇','頭皮護理','其他'];
const HINTS = {
  '洗面乳': {use:'早晚使用。手和臉打濕後，取約 1 元硬幣大小，加水搓出泡沫，以畫圈方式輕柔按摩全臉約 30 秒，再用溫水洗淨。', eff:'清潔臉部油脂、汗水與髒污。'},
  '卸妝':  {use:'晚上使用。以乾手乾臉取適量，輕輕按摩全臉溶解彩妝與防曬，加少量水乳化後，再用溫水洗淨，之後接洗面乳（雙重清潔）。', eff:'卸除彩妝、防曬與毛孔髒污。'},
  '化妝水': {use:'洗臉後第一步。倒在手心或化妝棉上，輕拍全臉至吸收。', eff:'補充水分、調理肌膚，幫助後續保養吸收。'},
  '精華液': {use:'化妝水後使用。取 2–3 滴於手心，均勻按壓全臉。', eff:'針對性保養（依產品：保濕、美白、抗老、修護等）。'},
  '安瓶':  {use:'化妝水後使用，取 1–2 滴按壓全臉，或依產品說明集中使用一段時間。', eff:'高濃度密集保養。'},
  '乳液':  {use:'精華後使用。取適量點在額頭、兩頰、下巴，由內往外推開。', eff:'保濕、鎖住水分，適合一般或偏油肌膚。'},
  '面霜':  {use:'保養最後一步（早上在防曬前）。取適量均勻塗抹全臉，乾燥處可加量。', eff:'深層滋潤、鎖水、修護肌膚屏障。'},
  '眼霜':  {use:'乳霜前使用。用無名指取米粒大小，輕點在眼周，由內往外輕拍至吸收。', eff:'滋潤眼周、改善細紋與乾燥。'},
  '防曬':  {use:'早上保養最後一步、上妝前。取足量（約兩指長）均勻塗抹臉頸，出門前 15–20 分鐘擦，戶外每 2–3 小時補擦。', eff:'阻隔紫外線 UVA/UVB，預防曬黑、曬傷與光老化。'},
  '面膜':  {use:'洗臉、化妝水後敷 10–15 分鐘，取下後輕拍至吸收，再接乳液或面霜。每週 2–3 次。', eff:'密集補水或針對性保養。'},
  '身體保養':{use:'洗澡後趁身體微濕時，取適量塗抹全身。', eff:'滋潤身體肌膚，改善乾燥粗糙。'},
  '護唇':  {use:'隨時可擦，睡前可厚擦一層當唇膜。', eff:'滋潤嘴唇，預防乾裂脫皮。'},
  '頭皮護理':{use:'洗髮後用毛巾擦到半乾，直接塗在頭皮，用指腹按摩 1 分鐘幫助吸收，不需沖洗。', eff:'調理頭皮環境、減少掉髮、讓髮根更有力。'},
  '其他':  {use:'', eff:''}
};

let items = load();
let filter = {status:'all', brand:'all', cat:'all', q:''};
const $ = s => document.querySelector(s);

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(it){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} if(it) cloudPut(it); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(d){ return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function addMonths(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function info(it){
  const now = parse(todayStr());
  const r = {opened:!!it.openDate, daysOpen:null, useBy:null, left:null, pct:0, level:'new'};
  if(it.openDate){
    const od = parse(it.openDate);
    r.daysOpen = daysBetween(od, now);
    r.useBy = addMonths(od, Number(it.pao||12));
  }
  if(it.expDate){
    const ex = parse(it.expDate);
    if(!r.useBy || ex < r.useBy) r.useBy = ex;
  }
  if(r.useBy){
    r.left = daysBetween(now, r.useBy);
    if(it.openDate){
      const total = daysBetween(parse(it.openDate), r.useBy) || 1;
      r.pct = Math.max(0, Math.min(100, r.left/total*100));
    }
    r.level = r.left < 0 ? 'bad' : r.left <= 30 ? 'warn' : (r.opened ? 'ok' : 'new');
  } else if(r.opened) r.level='ok';
  r.lowStock = r.opened && Number(it.stock||0) === 0;
  return r;
}

function render(){
  $('#today').textContent = '今天 ' + fmt(new Date());
  const all = items.map(it=>({it, i:info(it)}));
  $('#sTypes').textContent = items.length;
  $('#sBottles').textContent = items.reduce((s,it)=>s+Number(it.stock||0)+(it.openDate?1:0),0);
  $('#sOpened').textContent = all.filter(x=>x.i.opened).length;
  $('#sAlert').textContent = all.filter(x=>x.i.level==='bad'||x.i.level==='warn'||x.i.lowStock).length;
  document.querySelectorAll('.stat').forEach(s=>s.classList.toggle('active', s.dataset.f!=='all' && s.dataset.f===filter.status));

  // chips
  const statuses=[['all','全部'],['opened','使用中'],['unopened','未開封'],['alert','快過期/缺貨'],['expired','已過期']];
  $('#statusChips').innerHTML = statuses.map(([v,l])=>`<span class="chip ${filter.status===v?'on':''}" data-k="status" data-v="${v}">${l}</span>`).join('');
  const brands=[...new Set(items.map(it=>it.brand.trim()))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  if(filter.brand!=='all' && !brands.includes(filter.brand)) filter.brand='all';
  $('#brandChips').innerHTML = ['all',...brands].map(b=>`<span class="chip ${filter.brand===b?'on':''}" data-k="brand" data-v="${esc(b)}">${b==='all'?'全部':esc(b)} ${b==='all'?'':'('+items.filter(it=>it.brand.trim()===b).length+')'}</span>`).join('');
  const cats=CATS.filter(c=>items.some(it=>it.cat===c));
  $('#catChips').innerHTML = ['all',...cats].map(c=>`<span class="chip ${filter.cat===c?'on':''}" data-k="cat" data-v="${c}">${c==='all'?'全部':c}</span>`).join('');

  // filter
  const q = filter.q.trim().toLowerCase();
  let rows = all.filter(({it,i})=>{
    if(filter.brand!=='all' && it.brand.trim()!==filter.brand) return false;
    if(filter.cat!=='all' && it.cat!==filter.cat) return false;
    if(filter.status==='opened' && !i.opened) return false;
    if(filter.status==='unopened' && i.opened) return false;
    if(filter.status==='alert' && !(i.level==='bad'||i.level==='warn'||i.lowStock)) return false;
    if(filter.status==='expired' && i.level!=='bad') return false;
    if(q && ![it.brand,it.name,it.cat,it.use,it.eff,it.note].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  $('#count').textContent = `顯示 ${rows.length} / ${items.length} 項`;

  const sort = $('#sort').value;
  const byExp = (a,b)=>(a.i.left??99999)-(b.i.left??99999);
  if(sort==='expire') rows.sort(byExp);
  else if(sort==='opened') rows.sort((a,b)=>(b.it.openDate||'').localeCompare(a.it.openDate||''));
  else if(sort==='stock') rows.sort((a,b)=>Number(a.it.stock||0)-Number(b.it.stock||0));

  if(!items.length){
    $('#list').innerHTML = `<div class="empty-state">還沒有任何保養品<br>按右下角的 ＋ 新增第一瓶</div>`; return;
  }
  if(!rows.length){ $('#list').innerHTML = `<div class="empty-state">沒有符合條件的保養品</div>`; return; }

  if(sort==='brand'){
    const groups={};
    rows.forEach(r=>{ (groups[r.it.brand.trim()] ||= []).push(r); });
    $('#list').innerHTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(b=>{
      const g=groups[b].sort((x,y)=>CATS.indexOf(x.it.cat)-CATS.indexOf(y.it.cat));
      return `<div class="brand-group"><h2><span>${esc(b)}</span><span>${g.length} 項</span></h2>${g.map(card).join('')}</div>`;
    }).join('');
  } else {
    $('#list').innerHTML = rows.map(card).join('');
  }
}

function card({it,i}){
  const tags=[];
  if(i.opened){
    tags.push(`<span class="tag"><em>開瓶</em>${fmt(parse(it.openDate))}・D+${i.daysOpen+1}</span>`);
  } else tags.push(`<span class="tag"><em>狀態</em>未開封</span>`);
  if(i.useBy){
    const cls = i.level==='bad'?'bad':i.level==='warn'?'warn':'ok';
    const txt = i.left<0 ? `已過期 ${-i.left} 天` : i.left===0 ? '今天到期' : `剩 ${i.left} 天・${fmt(i.useBy)}`;
    tags.push(`<span class="tag ${cls}"><em>期限</em>${txt}</span>`);
  }
  const stock=Number(it.stock||0);
  tags.push(`<span class="tag ${i.lowStock?'warn':''}"><em>庫存</em>${stock} 瓶${i.lowStock?'・該補貨了':''}</span>`);
  const bar = i.opened && i.useBy ? `<div class="bar ${i.level==='bad'?'bad':i.level==='warn'?'warn':''}"><i style="width:${i.pct}%"></i></div>` : '';
  return `<div class="item s-${i.level}" data-id="${it.id}">
    <div class="item-top" data-act="toggle">
      <div class="item-head">
        <div><div class="brand"><span class="dot"></span>${esc(it.brand)}</div><div class="name">${esc(it.name)}${it.size?` <small style="font-weight:400;color:var(--muted);font-size:12px">${esc(it.size)}</small>`:''}</div></div>
        <span class="cat">${esc(it.cat)}</span>
      </div>
      <div class="meta">${tags.join('')}</div>${bar}
    </div>
    <div class="detail">
      <h4>사용법 ・ 使用方法</h4><p class="${it.use?'':'empty'}">${it.use?esc(it.use):'尚未填寫，按「編輯」補上'}</p>
      <h4>효능 ・ 功效</h4><p class="${it.eff?'':'empty'}">${it.eff?esc(it.eff):'尚未填寫，按「編輯」補上'}</p>
      ${it.note?`<h4>메모 ・ 備註</h4><p>${esc(it.note)}</p>`:''}
      <div class="stock-ctl"><span class="lbl">未開封庫存</span>
        <div class="qty"><button data-act="minus">−</button><span>${stock}</span><button data-act="plus">＋</button></div>
      </div>
      <div class="actions">
        <button class="btn primary" data-act="newbottle">${i.opened?'用完了，開新的一瓶':'今天開瓶'}</button>
        ${i.opened?`<button class="btn" data-act="finish">用完（不開新的）</button>`:''}
        <button class="btn ghost" data-act="edit">編輯</button>
      </div>
    </div>
  </div>`;
}

// list interactions
let openIds = new Set();
$('#list').addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const box=el.closest('.item'); const id=box.dataset.id; const it=items.find(x=>x.id===id);
  const act=el.dataset.act;
  if(act==='toggle'){ box.classList.toggle('open'); box.classList.contains('open')?openIds.add(id):openIds.delete(id); return; }
  if(act==='plus'){ it.stock=Number(it.stock||0)+1; }
  if(act==='minus'){ it.stock=Math.max(0,Number(it.stock||0)-1); }
  if(act==='newbottle'){
    if(it.openDate){
      if(Number(it.stock||0)<=0 && !confirm('庫存是 0，確定要記錄開新的一瓶嗎？（庫存不會變負數）')) return;
      it.stock=Math.max(0,Number(it.stock||0)-1);
    } else if(Number(it.stock||0)>0) it.stock=Number(it.stock)-1;
    it.openDate=todayStr(); toast('已記錄今天開瓶');
  }
  if(act==='finish'){
    if(!confirm('確定這瓶用完了嗎？會清除開瓶日，保留品項與庫存。')) return;
    it.openDate=''; toast('這瓶用完了');
  }
  if(act==='edit'){ openForm(it); return; }
  save(it); rerenderKeepOpen();
});
function rerenderKeepOpen(){ render(); openIds.forEach(id=>{ const el=document.querySelector(`.item[data-id="${id}"]`); if(el) el.classList.add('open'); }); }

// filters
document.querySelector('.tools').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  filter[c.dataset.k]=c.dataset.v; rerenderKeepOpen();
});
document.querySelectorAll('.stat').forEach(s=>s.addEventListener('click',()=>{ filter.status = (filter.status===s.dataset.f? 'all' : s.dataset.f); rerenderKeepOpen(); }));
$('#q').addEventListener('input', e=>{ filter.q=e.target.value; rerenderKeepOpen(); });
$('#sort').addEventListener('change', rerenderKeepOpen);

// form
$('#fCat').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
function openForm(it){
  $('#formTitle').textContent = it ? '編輯保養品' : '新增保養品';
  $('#fId').value = it?.id || '';
  $('#fBrand').value = it?.brand || (filter.brand!=='all'?filter.brand:'');
  $('#fName').value = it?.name || '';
  $('#fCat').value = it?.cat || '化妝水';
  $('#fSize').value = it?.size || '';
  $('#fOpen').value = it?.openDate || '';
  $('#fPao').value = String(it?.pao || 12);
  $('#fStock').value = it?.stock ?? 0;
  $('#fExp').value = it?.expDate || '';
  $('#fUse').value = it?.use || '';
  $('#fEff').value = it?.eff || '';

function closeForm(){ $('#modalBg').classList.remove('show'); document.querySelectorAll('.combo.open').forEach(c=>c.classList.remove('open')); }
$('#addBtn').onclick=()=>openForm(null);
$('#closeBtn').onclick=closeForm; $('#cancelBtn').onclick=closeForm;
$('#modalBg').addEventListener('click',e=>{ if(e.target===$('#modalBg')) closeForm(); });
document.querySelectorAll('.hintbtn').forEach(b=>b.onclick=()=>{
  const h=HINTS[$('#fCat').value]||{}; const t=b.dataset.hint==='use'?$('#fUse'):$('#fEff');
  const v=b.dataset.hint==='use'?h.use:h.eff;
  if(!v){ toast('這個類別沒有預設內容，請自行輸入'); return; }
  if(t.value && !confirm('要用常見內容取代目前填寫的文字嗎？')) return;
  t.value=v;
});
$('#form').addEventListener('submit', e=>{
  e.preventDefault();
  const id=$('#fId').value;
  const data={
    brand:$('#fBrand').value.trim(), name:$('#fName').value.trim(), cat:$('#fCat').value,
    size:$('#fSize').value.trim(), openDate:$('#fOpen').value, pao:Number($('#fPao').value),
    stock:Math.max(0,parseInt($('#fStock').value)||0), expDate:$('#fExp').value,
    use:$('#fUse').value.trim(), eff:$('#fEff').value.trim(), note:$('#fNote').value.trim()
  };
  if(!data.brand||!data.name) return;
  let target;
  if(id){ target=items.find(x=>x.id===id); Object.assign(target, data); toast('已更新'); }
  else { target={id:uid(), created:Date.now(), ...data}; items.push(target); toast('已新增'); }
  save(target); closeForm(); rerenderKeepOpen();
});
$('#delBtn').onclick=()=>{
  const id=$('#fId').value; const it=items.find(x=>x.id===id);
  if(!confirm(`確定刪除「${it.brand} ${it.name}」嗎？刪除後無法復原。`)) return;
  items=items.filter(x=>x.id!==id); openIds.delete(id); save(); cloudDel(id); closeForm(); render(); toast('已刪除');
};

// backup
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'skincare',version:1,exported:new Date().toISOString(),items},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`保養品備份_${todayStr()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); const arr=Array.isArray(d)?d:d.items;
      if(!Array.isArray(arr)) throw 0;
      const mode = items.length ? (confirm(`備份裡有 ${arr.length} 項。\n按「確定」= 取代目前資料\n按「取消」= 合併（同一筆會以備份為準）`)?'replace':'merge') : 'replace';
      const old=items.map(x=>x.id);
      if(mode==='replace') items=arr;
      else { const m=new Map(items.map(x=>[x.id,x])); arr.forEach(x=>m.set(x.id,x)); items=[...m.values()]; }
      items.forEach(x=>{ if(!x.id) x.id=uid(); });
      save(); cloudBatch(items, mode==='replace'?old.filter(i=>!items.some(x=>x.id===i)):[]); render(); toast('匯入完成');
    }catch(err){ alert('這個檔案不是保養品備份，無法匯入'); }
    e.target.value='';
  };
  r.readAsText(f);
};


// ---- 下拉選單（品牌／品名）----
const PRESET_BRANDS=[]; // 不內建品牌，只顯示自己新增過的
function brandOptions(){
  const mine=[...new Set(items.map(it=>it.brand.trim()))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const counts={}; items.forEach(it=>counts[it.brand.trim()]=(counts[it.brand.trim()]||0)+1);
  return {mine, counts, preset:PRESET_BRANDS.filter(b=>!mine.includes(b))};
}
function nameOptions(){
  const br=$('#fBrand').value.trim();
  const list=items.filter(it=>!br||it.brand.trim()===br);
  const seen=new Map(); list.forEach(it=>{ if(!seen.has(it.name)) seen.set(it.name,it); });
  return [...seen.values()];
}
function setupCombo(boxId, build, onPick){
  const box=$(boxId), inp=box.querySelector('input'), lst=box.querySelector('.combo-list');
  const draw=()=>{ lst.innerHTML=build(inp.value.trim()); };
  const open=()=>{ document.querySelectorAll('.combo.open').forEach(c=>c!==box&&c.classList.remove('open')); draw(); box.classList.add('open'); };
  inp.addEventListener('focus',open);
  inp.addEventListener('input',open);
  box.querySelector('.arrow').addEventListener('click',()=>{ if(box.classList.contains('open')){box.classList.remove('open');} else { open(); inp.focus(); } });
  lst.addEventListener('mousedown',e=>e.preventDefault());
  lst.addEventListener('click',e=>{ const o=e.target.closest('.opt'); if(!o) return; inp.value=o.dataset.v; box.classList.remove('open'); onPick&&onPick(o.dataset.v); });
  return {close:()=>box.classList.remove('open')};
}
document.addEventListener('click',e=>{ if(!e.target.closest('.combo')) document.querySelectorAll('.combo.open').forEach(c=>c.classList.remove('open')); });
const match=(t,q)=>!q||t.toLowerCase().includes(q.toLowerCase());
setupCombo('#cBrand', q=>{
  const {mine,counts,preset}=brandOptions(); let h='';
  const m=mine.filter(b=>match(b,q)), p=preset.filter(b=>match(b,q));
  if(q && !mine.includes(q) && !PRESET_BRANDS.includes(q)) h+=`<div class="opt new" data-v="${esc(q)}">＋ 新增品牌「${esc(q)}」</div>`;
  if(m.length) h+=`<div class="opt-sep">我的品牌</div>`+m.map(b=>`<div class="opt" data-v="${esc(b)}"><span>${esc(b)}</span><small>${counts[b]} 項</small></div>`).join('');
  if(p.length) h+=`<div class="opt-sep">常見品牌</div>`+p.map(b=>`<div class="opt" data-v="${esc(b)}"><span>${esc(b)}</span></div>`).join('');
  return h||`<div class="opt-sep">直接輸入新品牌名稱</div>`;
}, ()=>{ $('#fName').focus(); });
setupCombo('#cName', q=>{
  const br=$('#fBrand').value.trim();
  const opts=nameOptions().filter(it=>match(it.name,q)); let h='';
  if(q && !opts.some(it=>it.name===q)) h+=`<div class="opt new" data-v="${esc(q)}">＋ 新增品名「${esc(q)}」</div>`;
  if(opts.length) h+=`<div class="opt-sep">${br?esc(br)+' 的品項':'我的品項'}</div>`+opts.map(it=>`<div class="opt" data-v="${esc(it.name)}"><span>${esc(it.name)}</span><small>${br?esc(it.cat):esc(it.brand)}</small></div>`).join('');
  return h||`<div class="opt-sep">${br?'這個品牌還沒有品項，直接輸入品名':'直接輸入品名'}</div>`;
}, v=>{
  // 選到已有的品項 → 自動帶入類別、容量、PAO、用法、功效（只填空白欄位）
  if($('#fId').value) return;
  const br=$('#fBrand').value.trim();
  const src=items.find(it=>it.name===v&&(!br||it.brand.trim()===br)); if(!src) return;
  if(!br) $('#fBrand').value=src.brand;
  $('#fCat').value=src.cat; $('#fPao').value=String(src.pao||12);
  if(!$('#fSize').value) $('#fSize').value=src.size||'';
  if(!$('#fUse').value) $('#fUse').value=src.use||'';
  if(!$('#fEff').value) $('#fEff').value=src.eff||'';
  toast('已帶入之前的用法與功效');
});

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

// ---- 貼上 Claude 的代碼 ----
const CAT_ALIAS={'精華':'精華液','乳霜':'面霜','保濕霜':'面霜','卸妝油':'卸妝','卸妝水':'卸妝','洗顏':'洗面乳','潔面':'洗面乳','化粧水':'化妝水','爽膚水':'化妝水','防曬乳':'防曬','隔離':'防曬','唇膏':'護唇','身體乳':'身體保養','頭皮':'頭皮護理','頭皮精華':'頭皮護理','頭髮':'頭皮護理'};
function parseCode(txt){
  if(!txt) return null;
  const m=txt.match(/\{[\s\S]*\}/); if(!m) return null;
  try{ return JSON.parse(m[0]); }catch(e){ return null; }
}
function fillFromCode(d){
  if(!d||(!d.brand&&!d.name)) return false;
  const pick=(...k)=>{ for(const x of k) if(d[x]!=null&&d[x]!=='') return d[x]; return ''; };
  $('#fBrand').value=pick('brand','品牌');
  $('#fName').value=pick('name','品名');
  let c=pick('cat','category','類別'); c=CAT_ALIAS[c]||c; $('#fCat').value=CATS.includes(c)?c:'其他';
  const sz=pick('size','容量'); if(sz) $('#fSize').value=sz;
  const pao=parseInt(pick('pao','PAO')); if([3,6,9,12,18,24,36].includes(pao)) $('#fPao').value=String(pao);
  const use=pick('use','usage','如何使用','使用方法'); if(use) $('#fUse').value=Array.isArray(use)?use.join('\n'):use;
  const eff=pick('eff','benefits','功效'); if(eff) $('#fEff').value=Array.isArray(eff)?eff.join('\n'):eff;
  const note=pick('note','備註'); if(note) $('#fNote').value=note;
  const exp=pick('exp','expDate','有效期限'); if(/^\d{4}-\d{2}-\d{2}$/.test(exp)) $('#fExp').value=exp;
  return true;
}
$('#pasteBtn').onclick=async()=>{
  let txt='';
  try{ txt=await navigator.clipboard.readText(); }catch(e){}
  if(!parseCode(txt)) txt=prompt('把 Claude 給你的代碼貼在這裡：')||'';
  const d=parseCode(txt);
  if(fillFromCode(d)) toast('已自動填好，記得補開瓶日和庫存');
  else if(txt) alert('看不懂這段代碼，請確認有完整複製（包含前後的大括號 { }）');
};

})();

// ---- 雲端同步（Firebase：korea-buy-list 專案 → storeData/skincareDoc，獨立一份文件，與代購商品分開）----
let cdoc=null, pushTimer=null;
function setSync(t,cls){ const el=$('#sync'); el.textContent=t; el.className='sync '+(cls||''); }
function cloudErr(e){ console.error(e); setSync(e&&e.code==='permission-denied'?'雲端沒有權限':'雲端連線失敗','err'); }
function clean(it){ const o={}; Object.keys(it).forEach(k=>{ if(it[k]!==undefined) o[k]=it[k]; }); return o; }
function pushAll(){
  if(!cdoc) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ cdoc.set({items:items.map(clean), updated:Date.now()}).catch(cloudErr); },300);
}
function cloudPut(){ pushAll(); }
function cloudDel(){ pushAll(); }
function cloudBatch(){ pushAll(); }
(function initCloud(){
  if(typeof firebase==='undefined'){ setSync('離線（只存在這台裝置）','err'); return; }
  try{
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp({
      apiKey:"AIzaSyBHmyi3-dmv2Zcn8ULXwuIIODSWVdcDTdY", authDomain:"korea-buy-list.firebaseapp.com",
      projectId:"korea-buy-list", storageBucket:"korea-buy-list.firebasestorage.app",
      messagingSenderId:"131856493166", appId:"1:131856493166:web:1f4a1c108ffbfdb89a547f"
    });
    cdoc=app.firestore().collection('storeData').doc('skincareDoc');
    let first=true;
    cdoc.onSnapshot({includeMetadataChanges:true}, snap=>{
      const cloud=(snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
      if(first){
        first=false;
        // 第一次連上：把這台裝置上、雲端還沒有的資料一起合併上傳
        const ids=new Set(cloud.map(x=>x.id));
        const localOnly=items.filter(x=>!ids.has(x.id));
        if(localOnly.length){ items=[...cloud,...localOnly]; pushAll(); }
        else items=cloud;
      } else if(!snap.metadata.hasPendingWrites) items=cloud;
      try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){}
      setSync(snap.metadata.fromCache?'離線中（恢復連線後會自動同步）':'已同步雲端', snap.metadata.fromCache?'':'on');
      rerenderKeepOpen();
    }, cloudErr);
  }catch(e){ cloudErr(e); }
})();
</script>
